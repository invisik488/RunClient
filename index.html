<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerseDLC Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .card {
            background: #161b26;
            border: 1px solid #232a3b;
            border-radius: 16px;
            padding: 32px;
            width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
        }

        h2 { font-size: 20px; font-weight: 600; margin-bottom: 24px; color: #f3f4f6; }

        input {
            width: 100%;
            padding: 12px 16px;
            background: #0d111a;
            border: 1px solid #232a3b;
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            margin-bottom: 16px;
        }
        input:focus { border-color: #6366f1; }

        button {
            width: 100%;
            padding: 12px;
            background: #6366f1;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 8px;
        }
        button:hover { background: #4f46e5; }

        .result-box {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: #0d111a;
            border: 1px dashed #374151;
            border-radius: 10px;
        }

        .key-text {
            font-family: monospace;
            font-size: 16px;
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 12px;
            word-break: break-all;
        }

        .copy-btn { background: #10b981; margin-bottom: 0; }
        .copy-btn:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Генерация Ключа</h2>
        <input type="text" id="usernameInput" placeholder="Введите ник (например, Quesst)">
        <button onclick="generateKey()">Создать ключ</button>
        <button onclick="searchUser()" style="background: #374151;">Найти в базе</button>

        <div id="resultBox" class="result-box">
            <div id="keyDisplay" class="key-text"></div>
            <button id="copyBtn" class="copy-btn" onclick="copyKey()" style="display: none;">Скопировать ключ</button>
        </div>
    </div>

    <script>
        // Локальная база прямо на стороне браузера
        const dbUsers = [
            { username: "Quesst", key: "VERSE-9988-AABB" }
        ];

        function generateKey() {
            const rawNick = document.getElementById('usernameInput').value;
            const cleanNick = rawNick.trim();

            if (!cleanNick) return alert('Введите ник!');

            // Генерация ключа
            const randomHex = Math.random().toString(36).substring(2, 10).toUpperCase();
            const newKey = "VERSE-" + randomHex;

            // Обновляем или добавляем пользователя
            const existingIndex = dbUsers.findIndex(u => u.username.toLowerCase() === cleanNick.toLowerCase());
            if (existingIndex !== -1) {
                dbUsers[existingIndex].key = newKey;
            } else {
                dbUsers.push({ username: cleanNick, key: newKey });
            }

            document.getElementById('keyDisplay').innerText = "Ключ: " + newKey;
            document.getElementById('copyBtn').style.display = 'block';
            document.getElementById('resultBox').style.display = 'block';
        }

        function searchUser() {
            const rawNick = document.getElementById('usernameInput').value;
            const cleanSearch = rawNick.trim().toLowerCase();

            if (!cleanSearch) return alert('Введите ник для поиска!');

            const found = dbUsers.find(u => u.username.toLowerCase() === cleanSearch);

            if (found) {
                document.getElementById('keyDisplay').innerText = "Найден: " + found.username + "\nКлюч: " + (found.key || "Нет");
                document.getElementById('copyBtn').style.display = 'none';
            } else {
                document.getElementById('keyDisplay').innerText = "Пользователь не найден";
                document.getElementById('copyBtn').style.display = 'none';
            }
            document.getElementById('resultBox').style.display = 'block';
        }

        function copyKey() {
            const fullText = document.getElementById('keyDisplay').innerText;
            const keyOnly = fullText.replace("Ключ: ", "");
            
            navigator.clipboard.writeText(keyOnly).then(() => {
                alert('Ключ скопирован в буфер обмена!');
            });
        }
    </script>

</body>
</html>
