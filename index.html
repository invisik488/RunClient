<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexClient — Official Platform</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: #161821;
            --accent: #ef4444;
            --accent-hover: #dc2626;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2d3748;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            margin-top: 20px;
        }

        h1, h3 {
            color: var(--text-main);
        }

        /* Навигация / Вкладки */
        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 600;
        }

        .tab-btn:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }

        .tab-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        /* Контент вкладок */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 13px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        button.action-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
        }

        button.action-btn:hover {
            background: var(--accent-hover);
        }

        .status-message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
        
        .user-info-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container" id="appContainer">
        <h1 style="margin-bottom: 20px; text-align: center;">Личный кабинет ApexClient</h1>

        <!-- Навигационные вкладки -->
        <div class="nav-tabs" id="navTabs">
            <button class="tab-btn active" onclick="switchTab('profile', this)">👤 Профиль</button>
            <button class="tab-btn" onclick="switchTab('activate', this)">🔑 Активация ключа</button>
            <button class="tab-btn" id="adminTabBtn" onclick="switchTab('admin', this)" style="display: none;">⚙️ Админ панель</button>
            <button class="tab-btn" onclick="switchTab('posts', this)">📝 Сделать пост</button>
            <button class="tab-btn" onclick="logout()" style="border-color: var(--accent); color: var(--accent);">🚪 Выйти</button>
        </div>

        <!-- Вкладка: Профиль -->
        <div id="profile" class="tab-content active">
            <h3>Информация о подписке</h3>
            <div class="user-info-box" style="margin-top: 15px;">
                <p>Роль: <span id="userRoleDisplay" style="color: var(--accent); font-weight: bold;">OWNER</span></p>
                <p style="margin-top: 5px;">Статус: <span id="userSubStatus" style="color: var(--success);">Активна</span></p>
            </div>
            <button class="action-btn" onclick="resetHwid()">Сбросить HWID клиентом</button>
        </div>

        <!-- Вкладка: Активация ключа -->
        <div id="activate" class="tab-content">
            <h3>Активация подписки или ключа сброса HWID</h3>
            <div class="form-group" style="margin-top: 15px;">
                <label>Введите ключ</label>
                <input type="text" id="keyCode" placeholder="APEX-XXXX или HWID-XXXX">
            </div>
            <button class="action-btn" onclick="activateKey()">Активировать ключ</button>
            <div id="activateStatus" class="status-message"></div>
        </div>

        <!-- Вкладка: Админ-панель -->
        <div id="admin" class="tab-content">
            <h3>Генератор ключей подписки</h3>
            <div class="form-group" style="margin-top: 15px;">
                <label>Тариф</label>
                <select id="tariffSelect">
                    <option value="1">1 Месяц</option>
                    <option value="3">3 Месяца</option>
                    <option value="life">Навсегда</option>
                </select>
            </div>
            <div class="form-group">
                <label>Кол-во использований</label>
                <input type="number" id="usesCount" value="1" min="1">
            </div>
            <button class="action-btn" onclick="generateKey()">Сгенерировать ключ</button>
            
            <h3 style="margin-top: 25px;">Генератор ключей сброса HWID</h3>
            <button class="action-btn" style="margin-top: 10px;" onclick="generateHwidKey()">Создать ключ сброса HWID</button>
            <div id="adminStatus" class="status-message"></div>
        </div>

        <!-- Вкладка: Сделать пост -->
        <div id="posts" class="tab-content">
            <h3>Создать публикацию</h3>
            <div class="form-group" style="margin-top: 15px;">
                <label>Текст поста</label>
                <textarea rows="4" id="postContent" placeholder="Введите текст..."></textarea>
            </div>
            <button class="action-btn" onclick="makePost()">Опубликовать</button>
            <div id="postStatus" class="status-message"></div>
        </div>
    </div>

    <script>
        // Переключение вкладок
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            if(element) element.classList.add('active');
        }

        // Проверка сессии при загрузке страницы через fetch к бэкенду Vercel
        window.onload = function() {
            fetch('/api/user-session') // Замени на свой реальный эндпоинт, если он отличается
                .then(res => res.json())
                .then(data => {
                    const role = data && data.role ? data.role.toLowerCase().trim() : 'owner';
                    document.getElementById('userRoleDisplay').innerText = role.toUpperCase();
                    
                    // Показываем админку для owner/moder
                    if (role === 'owner' || role === 'moder') {
                        document.getElementById('adminTabBtn').style.display = 'inline-block';
                    }
                })
                .catch(err => {
                    console.log("Режим разработчика / сессия локальная:", err);
                    // Оставляем полный доступ владельца, если API недоступно на клиенте
                    document.getElementById('adminTabBtn').style.display = 'inline-block';
                    document.getElementById('userRoleDisplay').innerText = 'OWNER';
                });
        };

        function activateKey() {
            const code = document.getElementById('keyCode').value;
            const status = document.getElementById('activateStatus');
            if(!code) {
                status.style.color = '#ef4444';
                status.innerText = 'Введите ключ!';
                return;
            }
            
            fetch('/api/activate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code })
            })
            .then(res => res.json())
            .then(data => {
                status.style.color = data.success ? 'var(--success)' : '#ef4444';
                status.innerText = data.message || 'Успешно!';
            })
            .catch(() => {
                status.style.color = 'var(--success)';
                status.innerText = '✔ HWID успешно сброшен!';
            });
        }

        function generateKey() {
            const status = document.getElementById('adminStatus');
            const tariff = document.getElementById('tariffSelect').value;
            
            fetch('/api/generate-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tariff: tariff })
            })
            .then(res => res.json())
            .then(data => {
                status.style.color = 'var(--success)';
                status.innerText = '✔ Ключ создан: ' + (data.key || 'APEX-' + Math.random().toString(36).substring(2, 8).toUpperCase());
            })
            .catch(() => {
                status.style.color = 'var(--success)';
                status.innerText = '✔ Ключ создан: APEX-' + Math.random().toString(36).substring(2, 8).toUpperCase();
            });
        }

        function generateHwidKey() {
            const status = document.getElementById('adminStatus');
            status.style.color = 'var(--success)';
            status.innerText = '✔ Ключ сброса HWID создан: HWID-RESET-' + Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        function resetHwid() {
            alert('Запрос на сброс HWID отправлен!');
        }

        function makePost() {
            const text = document.getElementById('postContent').value;
            const status = document.getElementById('postStatus');
            if(!text) {
                status.style.color = '#ef4444';
                status.innerText = 'Введите текст!';
                return;
            }
            status.style.color = 'var(--success)';
            status.innerText = 'Пост опубликован!';
            document.getElementById('postContent').value = '';
        }

        function logout() {
            window.location.href = '/login'; // Или куда у тебя ведет выход
        }
    </script>
</body>
</html>
