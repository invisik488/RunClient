<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexClient — Главная</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0a0d14; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }

        /* Navigation */
        nav {
            background: #111622;
            border-bottom: 1px solid #1e2638;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 22px; font-weight: 800; color: #7c3aed; letter-spacing: 1px; }
        .logo span { color: #fff; }
        .nav-links { display: flex; gap: 24px; list-style: none; }
        .nav-links a { color: #9ca3af; text-decoration: none; font-weight: 500; transition: 0.2s; }
        .nav-links a:hover { color: #fff; }

        /* Main Container */
        .container { display: flex; flex: 1; padding: 32px; gap: 32px; max-width: 1200px; margin: 0 auto; width: 100%; }

        /* Sidebar / Cabinet Panel */
        .panel {
            background: #111622;
            border: 1px solid #1e2638;
            border-radius: 12px;
            padding: 24px;
            flex: 1;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .panel h3 { font-size: 18px; margin-bottom: 16px; color: #f3f4f6; border-bottom: 1px solid #1e2638; padding-bottom: 10px; }

        /* Forms & Controls */
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 12px;
            background: #080b11;
            border: 1px solid #1e2638;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: #7c3aed; }

        button {
            width: 100%;
            padding: 12px;
            background: #7c3aed;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 10px;
        }
        button:hover { background: #6d28d9; }
        .btn-secondary { background: #1f2937; }
        .btn-secondary:hover { background: #374151; }

        /* Response Display */
        .status-box {
            margin-top: 16px;
            padding: 12px;
            background: #080b11;
            border: 1px solid #1e2638;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">APEX<span>CLIENT</span></div>
        <ul class="nav-links">
            <li><a href="#">Главная</a></li>
            <li><a href="#">Личный кабинет</a></li>
            <li><a href="#">База пользователей</a></li>
        </ul>
    </nav>

    <div class="container">
        <!-- Левая панель: Личный кабинет -->
        <div class="panel">
            <h3>Личный Кабинет</h3>
            <div class="form-group">
                <label>Пользователь</label>
                <input type="text" id="currentUser" value="Quesst" readonly>
            </div>
            <div class="form-group">
                <label>Статус подписки</label>
                <input type="text" value="Активна (FULL ACCESS)" readonly style="color: #10b981;">
            </div>
            <button onclick="alert('Ключ скопирован в буфер!')">Скопировать ключ подписки</button>
        </div>

        <!-- Правая панель: Управление и поиск по базе -->
        <div class="panel">
            <h3>Поиск пользователя в базе</h3>
            <div class="form-group">
                <label>Никнейм</label>
                <input type="text" id="searchInput" placeholder="Введите ник (например, Quesst)">
            </div>
            <button onclick="searchUser()">Найти в базе</button>
            <button class="btn-secondary" onclick="generateKey()">Сгенерировать ключ</button>

            <div id="statusBox" class="status-box"></div>
        </div>
    </div>

    <script>
        async function searchUser() {
            const nickname = document.getElementById('searchInput').value.trim();
            const statusBox = document.getElementById('statusBox');

            if (!nickname) {
                alert('Введите ник!');
                return;
            }

            statusBox.style.display = 'block';
            statusBox.innerText = 'Поиск...';

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: nickname })
                });

                const data = await response.json();

                if (data.success) {
                    statusBox.style.color = '#10b981';
                    statusBox.innerText = `[SUCCESS] Пользователь ${data.user.username} найден в базе ApexClient.`;
                } else {
                    statusBox.style.color = '#ef4444';
                    statusBox.innerText = `[ERROR] ${data.message}`;
                }
            } catch (err) {
                statusBox.style.color = '#ef4444';
                statusBox.innerText = '[ERROR] Ошибка подключения к серверу.';
            }
        }

        function generateKey() {
            const statusBox = document.getElementById('statusBox');
            const key = "APEX-" + Math.random().toString(36).substring(2, 10).toUpperCase();
            statusBox.style.display = 'block';
            statusBox.style.color = '#38bdf8';
            statusBox.innerText = `Сгенерирован ключ: ${key}`;
        }
    </script>

</body>
</html>
