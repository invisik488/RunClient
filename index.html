<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerseDLC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #050505; color: #ffffff; min-height: 100vh; position: relative; overflow-x: hidden; }

        .screen { position: relative; z-index: 1; width: 100%; min-height: 100vh; }
        .hidden { display: none !important; }

        /* ------------------- АВТОРИЗАЦИЯ / РЕГИСТРАЦИЯ ------------------- */
        .auth-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: #0a0a0c;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        .auth-title {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .auth-subtitle {
            font-size: 13px;
            color: #666;
            text-align: center;
            margin-bottom: 24px;
        }

        .tabs {
            display: flex;
            background: #121215;
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #666;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: #1c1c21;
            color: #fff;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            background: #121215;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 14px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .form-input:focus {
            border-color: #ff3333;
        }

        .btn-submit {
            width: 100%;
            background: #ff3333;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #e62e2e;
        }

        /* ------------------- ЛИЧНЫЙ КАБИНЕТ ------------------- */
        .dash-container {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: #0a0a0c;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand-logo {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo span {
            color: #ff3333;
        }

        .user-card-side {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #121215;
            border-radius: 10px;
            margin-bottom: 24px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: rgba(255, 51, 51, 0.15);
            border: 1px solid #ff3333;
            color: #ff3333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .user-details .uname {
            font-size: 14px;
            font-weight: 700;
        }

        .user-details .urole {
            font-size: 10px;
            color: #ff3333;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-item {
            padding: 10px 14px;
            border-radius: 8px;
            color: #777;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(255, 51, 51, 0.1);
            color: #ff3333;
        }

        .btn-logout {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #777;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: 0.2s;
        }

        .btn-logout:hover {
            border-color: #ff3333;
            color: #ff3333;
        }

        .content {
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .card {
            background: #0a0a0c;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 24px;
        }

        .card-header {
            font-size: 11px;
            color: #555;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .sub-title {
            font-size: 20px;
            font-weight: 700;
            color: #00ff66;
            margin-bottom: 4px;
        }

        .sub-desc {
            font-size: 13px;
            color: #666;
        }

        .grid-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .info-item {
            background: #121215;
            padding: 12px 16px;
            border-radius: 8px;
        }

        .info-item label {
            font-size: 10px;
            color: #666;
            display: block;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .info-item val {
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА И РЕГИСТРАЦИИ -->
    <div id="authScreen" class="screen auth-wrapper">
        <div class="auth-card">
            <div class="auth-title">Verse<span>DLC</span></div>
            <div class="auth-subtitle">Панель управления клиентом</div>

            <div class="tabs">
                <button id="tabLogin" class="tab-btn active" onclick="switchAuth(false)">Вход</button>
                <button id="tabRegister" class="tab-btn" onclick="switchAuth(true)">Регистрация</button>
            </div>

            <form id="authForm">
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="usernameInput" class="form-input" placeholder="Введите логин" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="passwordInput" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" id="submitBtn" class="btn-submit">Войти</button>
            </form>
        </div>
    </div>

    <!-- ЭКРАН ЛИЧНОГО КАБИНЕТА -->
    <div id="dashScreen" class="screen dash-container hidden">
        <div class="sidebar">
            <div>
                <div class="brand-logo">Verse<span>DLC</span></div>

                <div class="user-card-side">
                    <div class="avatar" id="sideAvatar">I</div>
                    <div class="user-details">
                        <div class="uname" id="sideUname">invisik</div>
                        <div class="urole" id="sideUrole">OWNER</div>
                    </div>
                </div>

                <ul class="nav-menu">
                    <li class="nav-item active">👤 Профиль</li>
                    <li class="nav-item">⚡ Скачать Лоадер</li>
                    <li class="nav-item">🔑 Подписка</li>
                    <li class="nav-item" id="adminNav" style="color: #ff3333;">👑 Админ Панель</li>
                </ul>
            </div>

            <button class="btn-logout" onclick="logout()">Выйти</button>
        </div>

        <div class="content">
            <div class="card">
                <div class="card-header">Профиль пользователя</div>
                <div style="display: flex; align-items: center; gap: 16px;">
                    <div class="avatar" style="width: 54px; height: 54px; font-size: 20px;" id="mainAvatar">I</div>
                    <div>
                        <h2 style="font-size: 20px; font-weight: 700;" id="mainUname">invisik</h2>
                        <div class="grid-info">
                            <div class="info-item">
                                <label>Привязка HWID</label>
                                <val style="color: #00ff66;">Зафиксирован</val>
                            </div>
                            <div class="info-item">
                                <label>Версия клиента</label>
                                <val>1.21.11 Fabric</val>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">Текущая подписка</div>
                <div class="sub-title" id="subStatus">Активна (Навсегда)</div>
                <div class="sub-desc">Доступ ко всем функциям VerseDLC открыт.</div>
            </div>
        </div>
    </div>

    <script>
        let isRegister = false;

        const DB = {
            users: JSON.parse(localStorage.getItem('versedlc_db')) || [
                { username: 'invisik', password: '123', role: 'OWNER', sub: 'Активна (Навсегда)' }
            ]
        };

        function saveDB() {
            localStorage.setItem('versedlc_db', JSON.stringify(DB.users));
        }

        function switchAuth(reg) {
            isRegister = reg;
            document.getElementById('tabLogin').classList.toggle('active', !reg);
            document.getElementById('tabRegister').classList.toggle('active', reg);
            document.getElementById('submitBtn').innerText = reg ? 'Зарегистрироваться' : 'Войти';
        }

        document.getElementById('authForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('usernameInput').value.trim();
            const p = document.getElementById('passwordInput').value.trim();

            let user = DB.users.find(x => x.username.toLowerCase() === u.toLowerCase());

            if (isRegister) {
                if (user) return alert('Пользователь с таким именем уже существует!');
                user = {
                    username: u,
                    password: p,
                    role: (u.toLowerCase() === 'invisik') ? 'OWNER' : 'USER',
                    sub: 'Активна (Навсегда)'
                };
                DB.users.push(user);
                saveDB();
            }

            localStorage.setItem('versedlc_session', user ? user.username : u);
            render();
        });

        function logout() {
            localStorage.removeItem('versedlc_session');
            render();
        }

        function render() {
            const session = localStorage.getItem('versedlc_session');
            const authScreen = document.getElementById('authScreen');
            const dashScreen = document.getElementById('dashScreen');

            if (session) {
                authScreen.classList.add('hidden');
                dashScreen.classList.remove('hidden');

                let user = DB.users.find(x => x.username.toLowerCase() === session.toLowerCase()) || {
                    username: session,
                    role: (session.toLowerCase() === 'invisik') ? 'OWNER' : 'USER',
                    sub: 'Активна (Навсегда)'
                };

                const initial = user.username.charAt(0).toUpperCase();
                document.getElementById('sideAvatar').innerText = initial;
                document.getElementById('mainAvatar').innerText = initial;
                document.getElementById('sideUname').innerText = user.username;
                document.getElementById('mainUname').innerText = user.username;
                document.getElementById('sideUrole').innerText = user.role;
                document.getElementById('subStatus').innerText = user.sub;

                if (user.role !== 'OWNER') {
                    document.getElementById('adminNav').style.display = 'none';
                }
            } else {
                authScreen.classList.remove('hidden');
                dashScreen.classList.add('hidden');
            }
        }

        window.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
