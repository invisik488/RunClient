        .btn-logout-new:hover{border-color:#ff3344;color:#ff3344;background:rgba(255,51,68,0.05)}

        .lottery-header h3{font-size:20px;font-weight:800;color:#fff}
        .lottery-btn{background:#ff3344;color:#fff;border:none;padding:10px 18px;border-radius:14px;font-size:13.5px;font-weight:800;cursor:pointer;box-shadow:0 4px 15px rgba(255,51,68,0.35)}

        .roulette-scene{position:relative;height:110px;border-radius:10px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#12162a,#090b12 75%);border:1px solid #1b2032;margin-bottom:15px}
        .pointer-top,.pointer-bottom{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;z-index:3}
        .pointer-top{border-top:11px solid #e8b34b;filter:drop-shadow(0 0 6px rgba(232,179,75,0.8));margin:0 auto}
        .pointer-bottom{border-bottom:11px solid #e8b34b;filter:drop-shadow(0 0 6px rgba(232,179,75,0.8));margin:0 auto}
        .roulette-window{position:relative;width:100%;height:68px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,0.03),transparent 20%,transparent 80%,rgba(255,255,255,0.03))}
        .center-slot{position:absolute;left:50%;top:0;bottom:0;width:80px;transform:translateX(-50%);border-left:1px solid rgba(232,179,75,0.35);border-right:1px solid rgba(232,179,75,0.35);background:linear-gradient(180deg,rgba(232,179,75,0.08),transparent 30%,transparent 70%,rgba(232,179,75,0.08));z-index:1;pointer-events:none}
        .roulette-track{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;gap:10px;padding:0 10px;will-change:transform}

        .fade-right{right:0;background:linear-gradient(-90deg,#0c0f18 5%,transparent)}
        .case-scene{position:relative;height:180px;border-radius:10px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#12162a,#090b12 75%);border:1px solid #1b2032;margin-bottom:15px;display:flex;align-items:center;justify-content:center;flex-direction:column}
        .case-box{position:relative;width:100px;height:100px}

        .case-hazard{height:7px;background:repeating-linear-gradient(135deg,#e8b34b 0 8px,#14161f 8px 16px);opacity:.9}
        .case-seal{flex:1;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:#8fa3ff}
        .case-lid{position:absolute;left:0;right:0;top:0;height:38%;background:linear-gradient(155deg,#333c5e,#1a1f34);border:1px solid #3c4568;border-bottom:none;border-radius:8px 8px 0 0;transform-origin:top center;transition:transform .6s,opacity .5s}
        .case-box.opening .case-lid{transform:rotateX(-115deg) translateY(-10px);opacity:0}
        .case-box.hidden{opacity:0;transform:scale(0.5);pointer-events:none}
        .case-roulette{position:absolute;top:10px;left:0;right:0;bottom:10px;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.5);border-radius:8px;z-index:2}
        .case-roulette.active{display:flex}
        .case-roulette .mini-track{display:flex;gap:8px;padding:0 10px;overflow:hidden;width:100%;justify-content:center;transition:transform 5s cubic-bezier(0.12,0.85,0.18,1)}
        .case-roulette .mini-item{flex:0 0 60px;height:50px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Teko',sans-serif;font-size:18px;font-weight:700;color:#fff}

        .case-roulette .mini-item.tier-res{background:linear-gradient(155deg,#8c4bff,#5a2fb0)}

        .case-result-card{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:130px;padding:14px 12px;border-radius:10px;text-align:center;background:linear-gradient(155deg,rgba(232,179,75,0.2),rgba(20,16,6,0.7));border:1px solid rgba(232,179,75,0.5);opacity:0;filter:blur(14px);transform:translate(-50%,-50%) scale(1.5) rotateY(540deg);pointer-events:none;z-index:5}
        .case-result-card.materialize{animation:materialize .8s forwards}
        @keyframes materialize{0%{opacity:0;filter:blur(14px);transform:translate(-50%,-50%) scale(1.6) rotateY(540deg)}55%{opacity:1}100%{opacity:1;filter:blur(0);transform:translate(-50%,-50%) scale(1) rotateY(0deg)}}
        .case-result-tier{font-size:12px;color:#e8b34b;text-transform:uppercase}
        .case-result-duration{font-family:'Teko',sans-serif;font-size:32px;font-weight:700;line-height:1;color:#fff8e6;text-shadow:0 0 18px rgba(232,179,75,0.75)}
