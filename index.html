<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerseDLC — Вход / Регистрация</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Тёмный текстурный фон */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 80% 50%, rgba(30, 30, 30, 0.4) 0%, rgba(5, 5, 5, 1) 70%);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1100px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
        }

        /* ЛЕВАЯ ЧАСТЬ: ФОРМА */
        .form-section {
            width: 100%;
            max-width: 420px;
        }

        .logo-container {
            margin-bottom: 24px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            fill: #ffffff;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.2));
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #888888;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .input-group {
            margin-bottom: 16px;
            position: relative;
        }

        .input-label {
            display: block;
            font-size: 13px;
            color: #aaaaaa;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            width: 18px;
            height: 18px;
            fill: #666666;
            transition: fill 0.2s;
        }

        .input-field {
            width: 100%;
            background: #111111;
            border: 1px solid #222222;
            border-radius: 20px;
            padding: 14px 16px 14px 46px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        .input-field:focus {
            border-color: #444444;
            background: #141414;
        }

        .input-field:focus + .input-icon {
            fill: #ffffff;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0 28px 0;
            font-size: 13px;
            color: #aaaaaa;
            cursor: pointer;
        }

        .checkbox-container input {
            accent-color: #ffffff;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 20px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s, background 0.2s;
        }

        .submit-btn:hover {
            background: #e6e6e6;
        }

        .submit-btn:active {
            transform: scale(0.99);
        }

        /* ПРАВАЯ ЧАСТЬ: 3D ИКОНКА ВХОДА */
        .visual-section {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 450px;
            height: 450px;
        }

        .door-icon-3d {
            width: 280px;
            height: 280px;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.8));
        }

        @media (max-width: 900px) {
            .visual-section {
                display: none;
            }
            .container {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Левая колонка с формой -->
        <div class="form-section">
            <div class="logo-container">
                <!-- Буква A (Ваш логотип без фона) -->
                <svg class="brand-logo" viewBox="0 0 100 100">
                    <path d="M50 10 L15 85 L35 85 L44 65 L66 65 L50 28 L58 45 L78 85 L95 85 Z M48 55 L52 55 L50 50 Z" fill="currentColor"/>
                </svg>
            </div>

            <h1>Create Account</h1>
            <p class="subtitle">Join the elite community today.</p>

            <form id="authForm">
                <div class="input-group">
                    <label class="input-label">Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" class="input-field" placeholder="Enter your username" required>
                        <svg class="input-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="input-field" placeholder="Enter Password" required>
                        <svg class="input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                    </div>
                </div>

                <label class="checkbox-container">
                    <input type="checkbox" required checked>
                    I agree to the Terms of Service.
                </label>

                <button type="submit" class="submit-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                    Sign In / Sign Up
                </button>
            </form>
        </div>

        <!-- Правая колонка с 3D артом дверного проема -->
        <div class="visual-section">
            <svg class="door-icon-3d" viewBox="0 0 200 200">
                <defs>
                    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" />
                        <stop offset="50%" stop-color="#888888" />
                        <stop offset="100%" stop-color="#222222" />
                    </linearGradient>
                </defs>
                <!-- Закругленная рамка -->
                <rect x="50" y="30" width="100" height="140" rx="35" fill="none" stroke="url(#metalGrad)" stroke-width="8"/>
                <!-- Стрелка входа -->
                <path d="M20 100 L110 100 M90 80 L110 100 L90 120" fill="none" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
    </div>

    <script>
        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    alert('Успешный вход!');
                    window.location.reload();
                } else {
                    alert(data.message || 'Ошибка входа');
                }
            } catch (err) {
                alert('Ошибка соединения с сервером');
            }
        });
    </script>
</body>
</html>
