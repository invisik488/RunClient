<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerseDLC</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .card {
            background: #161b26;
            border: 1px solid #232a3b;
            border-radius: 16px;
            padding: 32px;
            width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
        }

        h2 { font-size: 20px; font-weight: 600; margin-bottom: 24px; color: #f3f4f6; }

        input {
            width: 100%;
            padding: 12px 16px;
            background: #0d111a;
            border: 1px solid #232a3b;
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            margin-bottom: 16px;
        }
        input:focus { border-color: #6366f1; }

        button {
            width: 100%;
            padding: 12px;
            background: #6366f1;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #4f46e5; }

        .result-box {
            display: none;
            margin-top: 20px;
            padding: 16px;
            background: #0d111a;
            border: 1px dashed #374151;
            border-radius: 10px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Поиск пользователя</h2>
        <input type="text" id="usernameInput" placeholder="Введите ник (например, Quesst)">
        <button onclick="searchUser()">Найти</button>

        <div id="resultBox" class="result-box"></div>
    </div>

    <script>
        async function searchUser() {
            const username = document.getElementById('usernameInput').value;
            const resultBox = document.getElementById('resultBox');

            if (!username) return alert('Введите ник!');

            try {
                const res = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });

                const data = await res.json();

                if (data.success) {
                    resultBox.style.display = 'block';
                    resultBox.innerText = 'Пользователь найден: ' + data.user.username;
                } else {
                    resultBox.style.display = 'block';
                    resultBox.innerText = data.message || 'Не найден';
                }
            } catch (err) {
                alert('Ошибка подключения к серверу');
            }
        }
    </script>

</body>
</html>
