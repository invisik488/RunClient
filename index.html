<script>
// ===== ПЕРЕВОД =====
const translations = { /* ... (уже есть) ... */ };
let currentLang = localStorage.getItem('runclient_lang') || 'ru';
function applyLanguage(lang) { /* ... (уже есть) ... */ }
document.getElementById('langSelect').addEventListener('change', function(){ applyLanguage(this.value); });
window.addEventListener('DOMContentLoaded', function(){ applyLanguage(currentLang); });

// ===== ЯДРО САЙТА =====
let currentUser = localStorage.getItem('runclient_user') || null;
let registeredUsers = JSON.parse(localStorage.getItem('runclient_users')) || {
    "invisik": { password: "123", role: "owner", sub: "Навсегда", banned: false, regDate: "10.08.2026", uid: 1, freeSpinUsed: false, freeCaseUsed: false },
    "sextazyst": { password: "123", role: "user", sub: "Нет", banned: false, regDate: "12.08.2026", uid: 2, freeSpinUsed: false, freeCaseUsed: false },
    "veselchak": { password: "123", role: "user", sub: "Нет", banned: false, regDate: "15.08.2026", uid: 3, freeSpinUsed: false, freeCaseUsed: false }
};
let appRequests = JSON.parse(localStorage.getItem('runclient_requests')) || { hwid: [], subs: [], tickets: [] };
let activeKeysDB = JSON.parse(localStorage.getItem('runclient_keys')) || {};
let specialKeysDB = JSON.parse(localStorage.getItem('runclient_special_keys')) || {};
let lotteryState = JSON.parse(localStorage.getItem('runclient_lottery')) || { goldRush: { active: false, duration: 1, limit: 3, used: 0, startTime: null, timerInterval: null, usedUsers: [] } };

function saveDB() {
    localStorage.setItem('runclient_users', JSON.stringify(registeredUsers));
    localStorage.setItem('runclient_requests', JSON.stringify(appRequests));
    localStorage.setItem('runclient_keys', JSON.stringify(activeKeysDB));
    localStorage.setItem('runclient_special_keys', JSON.stringify(specialKeysDB));
    localStorage.setItem('runclient_lottery', JSON.stringify(lotteryState));
}

function showToast(msg, type = 'success') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.innerHTML = '<span>' + (type === 'success' ? '✅' : '❌') + '</span> ' + msg;
    container.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
}

function navigateTo(page) {
    if (page === 'cabinet' && !currentUser) page = 'auth';
    document.querySelectorAll('.page-section').forEach(sec => sec.classList.add('hidden'));
    const target = document.getElementById('page-' + page);
    if (target) target.classList.remove('hidden');
    document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
    const active = document.getElementById('nav-' + page);
    if (active) active.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function switchAuthTab(tab) {
    document.getElementById('authFormLogin').classList.toggle('hidden', tab !== 'login');
    document.getElementById('authFormRegister').classList.toggle('hidden', tab !== 'register');
}

// ===== АВТОРИЗАЦИЯ =====
function handleLogin() {
    const username = document.getElementById('loginUsernameInput').value.trim();
    const pass = document.getElementById('loginPasswordInput').value.trim();
    if (!username || !pass) { showToast('Заполните все поля!', 'error'); return; }
    const lower = username.toLowerCase();
    if (!registeredUsers[lower]) { showToast('Пользователь не найден!', 'error'); return; }
    if (registeredUsers[lower].password !== pass) { showToast('Неверный пароль!', 'error'); return; }
    if (registeredUsers[lower].banned) { showToast('Аккаунт заблокирован!', 'error'); return; }
    currentUser = username;
    localStorage.setItem('runclient_user', currentUser);
    updateCabinetUI();
    updateLotteryUI();
    showToast('Добро пожаловать, ' + currentUser + '!', 'success');
    navigateTo('cabinet');
}

function handleRegister() {
    const username = document.getElementById('regUsernameInput').value.trim();
    const pass = document.getElementById('regPasswordInput').value.trim();
    if (!username || !pass || username.length < 3 || pass.length < 3) { showToast('Ник и пароль минимум 3 символа!', 'error'); return; }
    const lower = username.toLowerCase();
    if (registeredUsers[lower]) { showToast('Пользователь уже существует!', 'error'); return; }
    registeredUsers[lower] = { password: pass, role: 'user', sub: 'Нет', banned: false, regDate: new Date().toLocaleDateString(), uid: Object.keys(registeredUsers).length + 1, freeSpinUsed: false, freeCaseUsed: false };
    saveDB();
    currentUser = username;
    localStorage.setItem('runclient_user', currentUser);
    updateCabinetUI();
    updateLotteryUI();
    showToast('Аккаунт создан!', 'success');
    navigateTo('cabinet');
}

function logout() { localStorage.removeItem('runclient_user'); currentUser = null; document.getElementById('navCabinetText').innerText = 'Кабинет'; navigateTo('home'); showToast('Вы вышли'); }

function updateCabinetUI() {
    if (!currentUser) return;
    const user = registeredUsers[currentUser.toLowerCase()];
    if (!user) return;
    document.getElementById('sidebarAvatarNew').innerText = currentUser.charAt(0).toUpperCase();
    document.getElementById('sidebarUsernameNew').innerText = currentUser;
    document.getElementById('sidebarEmailNew').innerText = currentUser.toLowerCase() + '@runclient.tech';
    document.getElementById('sidebarRoleNew').innerText = (user.role || 'user').toUpperCase();
    document.getElementById('sidebarUidNew').innerText = 'UID: ' + (user.uid || '--');
    document.getElementById('navCabinetText').innerText = currentUser;
    document.getElementById('dashSubValue').innerText = user.sub || 'Нет';
    document.getElementById('dashRegValue').innerText = user.regDate || '--';
    document.getElementById('dashAccessValue').innerText = user.banned ? 'Забанен' : 'Активен';
    document.getElementById('dashAccessValue').className = 'value ' + (user.banned ? 'red' : 'green');
    document.getElementById('dashUidValue').innerText = user.uid || '--';
    const progress = document.getElementById('subProgress');
    if (user.sub && user.sub !== 'Нет' && user.sub !== 'нет') { progress.style.width = '100%'; progress.style.background = 'linear-gradient(90deg, var(--accent-green), #00e676)'; } else { progress.style.width = '0%'; progress.style.background = 'linear-gradient(90deg, var(--accent-red), #ff6b6b)'; }
    const subText = document.getElementById('subStatusTextNew');
    const subDesc = document.getElementById('subStatusDescNew');
    if (user.banned) { subText.innerText = 'ЗАБАНЕН (' + user.banReason + ')'; subText.style.color = 'var(--accent-red)'; subDesc.innerText = 'Учетная запись заблокирована.'; }
    else if (!user.sub || user.sub === 'Нет' || user.sub === 'нет') { subText.innerText = 'НЕТ АКТИВНОЙ ПОДПИСКИ'; subText.style.color = 'var(--accent-red)'; subDesc.innerText = 'Приобретите подписку в разделе «Тарифы» или активируйте ключ.'; }
    else { subText.innerText = 'ПОДПИСКА АКТИВНА (' + user.sub + ')'; subText.style.color = 'var(--accent-green)'; subDesc.innerText = 'Доступ к клиенту работает без ограничений.'; }
    const role = (user.role || 'user').toLowerCase();
    ['navItemPostNew','navItemModerationNew','navItemCapabilitiesNew','navItemRolesNew','navItemGoldRush','navItemAdminNew'].forEach(id => document.getElementById(id).classList.add('hidden'));
    if (role === 'owner' || role === 'admin' || currentUser.toLowerCase() === 'invisik') {
        ['navItemPostNew','navItemCapabilitiesNew','navItemRolesNew','navItemGoldRush'].forEach(id => document.getElementById(id).classList.remove('hidden'));
    }
    if (role === 'owner' || role === 'admin' || role === 'moder') {
        document.getElementById('navItemModerationNew').classList.remove('hidden');
        document.getElementById('navItemGoldRush').classList.remove('hidden');
    }
    if (role === 'owner' || currentUser.toLowerCase() === 'invisik') {
        document.getElementById('navItemAdminNew').classList.remove('hidden');
    }
    renderOrders();
    renderUserTickets();
    updateGoldRushUI();
}

// ===== КАБИНЕТ: ВКЛАДКИ =====
function switchCabinetTab(tab, el) {
    document.querySelectorAll('.cab-tab-content').forEach(t => t.classList.add('hidden'));
    const target = document.getElementById('cab-' + tab);
    if (target) target.classList.remove('hidden');
    document.querySelectorAll('.nav-item-new').forEach(i => i.classList.remove('active'));
    if (el) el.classList.add('active');
    if (tab === 'moderation') renderModerationData();
    if (tab === 'tickets') renderUserTickets();
    if (tab === 'roles') renderRolesManagement();

// ===== ЗАКАЗЫ =====
function renderOrders() {
    const container = document.getElementById('ordersListContainer');
    if (!currentUser) { container.innerHTML = '<p class="sub-desc">Войдите, чтобы видеть заказы.</p>'; return; }
    const orders = appRequests.subs.filter(s => s.username.toLowerCase() === currentUser.toLowerCase());
    if (orders.length === 0) { container.innerHTML = '<p class="sub-desc">У вас пока нет активных подписок.</p>'; return; }
    container.innerHTML = orders.map(o => '<div style="background:rgba(0,0,0,0.3);padding:12px;border-radius:12px;margin-bottom:8px;border:1px solid var(--border-color)"><div style="font-weight:800;color:#fff;">' + o.tariff + '</div><div style="font-size:.7rem;color:var(--text-sub)">Дата: ' + o.date + '</div></div>').join('');
}

// ===== ТИКЕТЫ =====

    if (!currentUser) { showToast('Войдите в аккаунт!', 'error'); return; }
    const subject = document.getElementById('ticketSubject').value.trim();
    const message = document.getElementById('ticketMessage').value.trim();
    if (!subject || !message) { showToast('Заполните все поля!', 'error'); return; }
    appRequests.tickets.push({ username: currentUser, subject, message, status: 'Ожидает ответа', date: new Date().toLocaleDateString() });
    saveDB();
    showToast('Тикет отправлен!', 'success');
    document.getElementById('ticketSubject').value = '';
    document.getElementById('ticketMessage').value = '';
    renderUserTickets();
}

function renderUserTickets() {
    const container = document.getElementById('userTicketsContainer');
    if (!currentUser) { container.innerHTML = '<p class="sub-desc">Войдите, чтобы видеть тикеты.</p>'; return; }
    const tickets = appRequests.tickets.filter(t => t.username.toLowerCase() === currentUser.toLowerCase());
    document.getElementById('ticketCountBadgeNew').innerText = tickets.length;
    if (tickets.length === 0) { container.innerHTML = '<p class="sub-desc">Вы еще не отправляли вопросы.</p>'; return; }
    container.innerHTML = tickets.map(t => '<div style="background:rgba(0,0,0,0.3);padding:14px;border-radius:14px;margin-bottom:10px;border:1px solid var(--border-color)"><div style="font-weight:800;color:#fff;">Тема: ' + t.subject + '</div><div style="font-size:.85rem;color:var(--text-sub);margin-bottom:8px">' + t.message + '</div><div style="font-size:.7rem;color:var(--accent-green);font-weight:700">Статус: ' + t.status + '</div></div>').join('');
}

// ===== ПОКУПКА ТАРИФОВ =====
function buyTariff(name) { if (!currentUser) { showToast('Войдите в аккаунт!', 'error'); return; } appRequests.subs.push({ username: currentUser, tariff: name, date: new Date().toLocaleDateString() }); saveDB(); showToast('Заявка на "' + name + '" создана!', 'success'); }

function requestHWIDResetModal() { if (!currentUser) return; const reason = prompt('Причина сброса HWID:'); if (!reason) return; appRequests.hwid.push({ username: currentUser, hwid: 'HWID-' + Math.random().toString(36).substring(2,6), reason: reason, date: new Date().toLocaleDateString() }); saveDB(); showToast('Заявка отправлена.'); }

// ===== ОТЗЫВЫ =====

// ===== ЛОТЕРЕЯ =====
let spinAttempts = 1;
let caseAttempts = 1;
let isSpinning = false;
let isOpening = false;

function updateLotteryUI() {
    if (!currentUser) return;
    const user = registeredUsers[currentUser.toLowerCase()];
    if (!user) return;
    // Обновляем статус бесплатных попыток
    document.getElementById('spinBadge').innerText = user.freeSpinUsed ? 'платно (1 попытка)' : 'бесплатно';
    document.getElementById('caseBadge').innerText = user.freeCaseUsed ? 'платно (1 попытка)' : 'бесплатно';
    document.getElementById('spinAttempts').innerText = spinAttempts;
    document.getElementById('caseAttempts').innerText = caseAttempts;
    // Обновляем индикатор золотой лихорадки
    const gr = lotteryState.goldRush;
    const indicator = document.getElementById('goldRushIndicator');
    if (gr.active) {
        indicator.classList.remove('hidden');
        document.getElementById('goldRushCount').innerText = gr.used + '/' + gr.limit;
        updateGoldRushTimer();
    } else {
        indicator.classList.add('hidden');
    }
}

function initRoulette() {
    const track = document.getElementById('rouletteTrack');
    const segments = ['7д', '30д', '90д', '7д', '30д', '90д', '7д', '30д', '90д', '7д', '30д', '90д', '7д', '30д', '90д', '7д', '30д', '90д', '7д', '30д', '90д'];
    track.innerHTML = segments.map(s => '<div style="background:rgba(255,255,255,0.06);padding:6px 14px;border-radius:6px;font-size:14px;font-weight:700;color:#fff;white-space:nowrap;border:1px solid rgba(255,255,255,0.06);">' + s + '</div>').join('');
}

function spinRoulette() {
    if (isSpinning) return;
    if (!currentUser) { showToast('Войдите в аккаунт!', 'error'); return; }
    const user = registeredUsers[currentUser.toLowerCase()];
    if (!user) return;
    // Проверка бесплатной попытки
    if (!user.freeSpinUsed) {
        user.freeSpinUsed = true;
        saveDB();
    } else {
        if (spinAttempts <= 0) { showToast('У вас нет попыток!', 'error'); return; }
        spinAttempts--;
    }
    isSpinning = true;
    document.getElementById('spinBtn').disabled = true;
    document.getElementById('rouletteStatus').innerText = 'Вращение...';
    const track = document.getElementById('rouletteTrack');
    const totalSegments = track.children.length;
    const centerIndex = Math.floor(totalSegments / 2);
    // Выбор выигрыша (с учетом шансов)
    const rand = Math.random();
    let win = '7д';
    if (rand < 0.005) win = '90д';
    else if (rand < 0.025) win = '30д';
    else if (rand < 0.175) win = '7д';
    else win = '7д'; // fallback
    // Находим индекс сегмента с выигрышем
    let targetIndex = -1;
    for (let i = 0; i < totalSegments; i++) {
        if (track.children[i].innerText === win) { targetIndex = i; break; }
    }
    if (targetIndex === -1) targetIndex = 0;
    // Смещение так, чтобы целевой сегмент оказался в центре
    const offset = targetIndex - centerIndex;
    const segmentWidth = 80; // примерная ширина сегмента
    const shift = offset * segmentWidth;
    // Анимация
    const duration = 3000;
    const start = performance.now();
    const startPos = parseFloat(track.style.transform?.replace(/[^0-9\-.]/g, '') || 0);
    const totalShift = shift + (Math.floor(Math.random() * 5) + 5) * totalSegments * segmentWidth; // несколько оборотов
    function animate(time) {
        const elapsed = time - start;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const currentShift = startPos + totalShift * eased;
        track.style.transform = 'translateX(' + currentShift + 'px)';
        if (progress < 1) {
            requestAnimationFrame(animate);
        } else {
            isSpinning = false;
            document.getElementById('spinBtn').disabled = false;
            document.getElementById('rouletteStatus').innerText = 'Выигрыш: ' + win;
            // Начисляем подписку
            if (win !== '7д' && win !== '30д' && win !== '90д') win = '7д';
            user.sub = win;
            saveDB();
            updateCabinetUI();
            showToast('Поздравляем! Вы выиграли подписку ' + win + '!', 'success');
        }
    }
    requestAnimationFrame(animate);
}

function openCase() {
    if (isOpening) return;
    if (!currentUser) { showToast('Войдите в аккаунт!', 'error'); return; }
    const user = registeredUsers[currentUser.toLowerCase()];
    if (!user) return;
    // Проверка золотой лихорадки
    const gr = lotteryState.goldRush;
    let isGoldRushFree = false;
    if (gr.active && gr.used < gr.limit && !gr.usedUsers.includes(currentUser.toLowerCase())) {
        isGoldRushFree = true;
    }
    // Проверка бесплатной попытки или золотой лихорадки
    if (!user.freeCaseUsed && !isGoldRushFree) {
        user.freeCaseUsed = true;
        saveDB();
    } else if (isGoldRushFree) {
        // Используем золотую лихорадку
        gr.used++;
        gr.usedUsers.push(currentUser.toLowerCase());
        saveDB();
        updateGoldRushUI();
    } else {
        if (caseAttempts <= 0) { showToast('У вас нет попыток!', 'error'); return; }
        caseAttempts--;
    }
    isOpening = true;
    document.getElementById('caseBtn').disabled = true;
    document.getElementById('caseStatus').innerText = 'Открытие...';
    // Анимация открытия кейса
    const lid = document.querySelector('.case-lid');
    const resultCard = document.getElementById('caseResult');
    const burst = document.getElementById('caseBurst');
    // Открываем крышку
    lid.style.transform = 'rotateX(-120deg)';
    lid.style.opacity = '0';
    // Через 1.5 секунды показываем результат
    setTimeout(() => {
        // Определяем выигрыш
        const rand = Math.random();
        let win = '7д';
        let tier = 'Обычная';
        if (rand < 0.005) { win = '90д'; tier = 'Легендарная'; }
        else if (rand < 0.025) { win = '30д'; tier = 'Редкая'; }
        else if (rand < 0.175) { win = '7д'; tier = 'Обычная'; }
        else { win = '7д'; tier = 'Обычная'; }
        document.getElementById('caseResultTier').innerText = tier;
        document.getElementById('caseResultDuration').innerText = win;
        // Показываем результат с эффектом
        resultCard.style.opacity = '1';
        resultCard.style.filter = 'blur(0px)';
        resultCard.style.transform = 'translate(-50%,-50%) scale(1) rotateY(0deg)';
        burst.style.opacity = '1';
        burst.style.transform = 'scale(4)';
        setTimeout(() => { burst.style.opacity = '0'; burst.style.transform = 'scale(1)'; }, 800);
        // Начисляем подписку
        user.sub = win;
        saveDB();
        updateCabinetUI();
        showToast('Поздравляем! Вы выиграли подписку ' + win + '!', 'success');
        document.getElementById('caseStatus').innerText = 'Выигрыш: ' + win;
        isOpening = false;
        document.getElementById('caseBtn').disabled = false;
        // Закрываем крышку обратно через 3 секунды
        setTimeout(() => {
            lid.style.transform = 'rotateX(0deg)';
            lid.style.opacity = '1';
            resultCard.style.opacity = '0';
            resultCard.style.filter = 'blur(14px)';
            resultCard.style.transform = 'translate(-50%,-50%) scale(1.5) rotateY(540deg)';
        }, 3000);
    }, 1500);
}

// ===== КЛЮЧИ =====
function activateSubKey() {
    if (!currentUser) { showToast('Войдите в аккаунт!', 'error'); return; }
    const key = document.getElementById('subKeyInput').value.trim();
    if (!key) { showToast('Введите ключ!', 'error'); return; }
    if (!activeKeysDB[key]) { showToast('Неверный ключ!', 'error'); return; }
    const data = activeKeysDB[key];
    if (data.used) { showToast('Ключ уже использован!', 'error'); return; }
    data.used = true;
    const user = registeredUsers[currentUser.toLowerCase()];
    user.sub = data.duration;
    saveDB();
    updateCabinetUI();
    showToast('Подписка ' + data.duration + ' активирована!', 'success');
    document.getElementById('subKeyInput').value = '';
}

function activateHWIDKey() {
    if (!currentUser) { showToast('Войдите в аккаунт!', 'error'); return; }
    const key = document.getElementById('hwidKeyInput').value.trim();
    if (!key) { showToast('Введите ключ!', 'error'); return; }
    if (!activeKeysDB[key]) { showToast('Неверный ключ!', 'error'); return; }
    const data = activeKeysDB[key];
    if (data.used) { showToast('Ключ уже использован!', 'error'); return; }
    if (data.type !== 'hwid') { showToast('Это не ключ сброса HWID!', 'error'); return; }
    data.used = true;
    showToast('HWID успешно сброшен!', 'success');
    document.getElementById('hwidKeyInput').value = '';
}

function activateSpecialKey() {
    if (!currentUser) { showToast('Войдите в аккаунт!', 'error'); return; }
    const key = document.getElementById('specialKeyInput').value.trim();
    if (!key) { showToast('Введите ключ!', 'error'); return; }
    if (!specialKeysDB[key]) { showToast('Неверный спец ключ!', 'error'); return; }
    const data = specialKeysDB[key];
    if (data.used >= data.maxUses) { showToast('Ключ исчерпал лимит использований!', 'error'); return; }
    data.used++;
    const user = registeredUsers[currentUser.toLowerCase()];
    user.role = data.role;
    saveDB();
    updateCabinetUI();
    showToast('Роль ' + data.role + ' выдана!', 'success');
    document.getElementById('specialKeyInput').value = '';
}

// ===== ГЕНЕРАЦИЯ КЛЮЧЕЙ (панель владельца) =====
function generateSubKey() {
    if (!currentUser || registeredUsers[currentUser.toLowerCase()]?.role !== 'owner') { showToast('Доступ запрещён!', 'error'); return; }
    const duration = document.getElementById('genSubDuration').value;
    const key = 'RUN-SUB-' + Math.random().toString(36).substring(2,8).toUpperCase();
    activeKeysDB[key] = { duration, used: false, type: 'sub' };
    saveDB();
    document.getElementById('generatedKeyOutput').innerHTML = '✅ Ключ подписки (' + duration + '): <code style="background:rgba(0,0,0,0.5);padding:4px 10px;border-radius:6px;">' + key + '</code>';
    showToast('Ключ сгенерирован!', 'success');
}

function generateHWIDKey() {

    const key = 'RUN-HWID-' + Math.random().toString(36).substring(2,8).toUpperCase();
    activeKeysDB[key] = { type: 'hwid', used: false };
    saveDB();
    document.getElementById('generatedKeyOutput').innerHTML = '✅ Ключ сброса HWID: <code style="background:rgba(0,0,0,0.5);padding:4px 10px;border-radius:6px;">' + key + '</code>';
    showToast('Ключ сброса HWID сгенерирован!', 'success');
}

function generateSpecialKey() {
    if (!currentUser || registeredUsers[currentUser.toLowerCase()]?.role !== 'owner') { showToast('Доступ запрещён!', 'error'); return; }
    const role = document.getElementById('specialRoleSelect').value;
    const uses = parseInt(document.getElementById('specialUsesInput').value) || 1;
    const key = 'RUN-SPECIAL-' + Math.random().toString(36).substring(2,8).toUpperCase();
    specialKeysDB[key] = { role, maxUses: uses, used: 0 };

    document.getElementById('generatedKeyOutput').innerHTML = '✅ Спец ключ (роль: ' + role + ', использований: ' + uses + '): <code style="background:rgba(0,0,0,0.5);padding:4px 10px;border-radius:6px;">' + key + '</code>';
    showToast('Спец ключ сгенерирован!', 'success');
}

// ===== МОДЕРАЦИЯ =====
function renderModerationData() {
    if (!currentUser) return;
    const user = registeredUsers[currentUser.toLowerCase()];
    const role = user?.role || 'user';
    if (!['owner','admin','moder'].includes(role)) return;
    // Подписки
    const subContainer = document.getElementById('purchaseRequestsContainer');
    const subs = appRequests.subs.filter(s => s.status !== 'approved');
    if (subs.length === 0) subContainer.innerHTML = '<p class="sub-desc">Нет активных запросов.</p>';
    else {
        subContainer.innerHTML = subs.map((s, idx) => `
            <div style="background:rgba(0,0,0,0.3);padding:12px;border-radius:12px;margin-bottom:8px;border:1px solid var(--border-color);">
                <div style="font-weight:800;color:#fff;">${s.username} — ${s.tariff}</div>
                <div style="font-size:.7rem;color:var(--text-sub);">Дата: ${s.date}</div>
                <div style="margin-top:6px;display:flex;gap:8px;">
                    <button class="action-btn green" style="padding:4px 12px;font-size:.7rem;" onclick="approveSub(${idx})">✅ Одобрить</button>
                    <button class="action-btn" style="padding:4px 12px;font-size:.7rem;background:#666;" onclick="rejectSub(${idx})">❌ Отклонить</button>
                </div>
            </div>
        `).join('');
    }
    // HWID
    const hwidContainer = document.getElementById('hwidRequestsContainer');
    const hwidReqs = appRequests.hwid.filter(h => h.status !== 'approved');
    if (hwidReqs.length === 0) hwidContainer.innerHTML = '<p class="sub-desc">Нет активных заявок.</p>';
    else {
        hwidContainer.innerHTML = hwidReqs.map((h, idx) => `
            <div style="background:rgba(0,0,0,0.3);padding:12px;border-radius:12px;margin-bottom:8px;border:1px solid var(--border-color);">
                <div style="font-weight:800;color:#fff;">${h.username} — ${h.hwid}</div>
                <div style="font-size:.7rem;color:var(--text-sub);">Причина: ${h.reason}</div>
                <div style="margin-top:6px;display:flex;gap:8px;">
                    <button class="action-btn green" style="padding:4px 12px;font-size:.7rem;" onclick="approveHWID(${idx})">✅ Одобрить</button>
                    <button class="action-btn" style="padding:4px 12px;font-size:.7rem;background:#666;" onclick="rejectHWID(${idx})">❌ Отклонить</button>
                </div>
            </div>
        `).join('');
    }
    // Тикеты
    const ticketContainer = document.getElementById('adminTicketsContainer');
    const tickets = appRequests.tickets.filter(t => t.status !== 'answered');
    if (tickets.length === 0) ticketContainer.innerHTML = '<p class="sub-desc">Нет активных вопросов.</p>';
    else {
        ticketContainer.innerHTML = tickets.map((t, idx) => `
            <div style="background:rgba(0,0,0,0.3);padding:12px;border-radius:12px;margin-bottom:8px;border:1px solid var(--border-color);">
                <div style="font-weight:800;color:#fff;">${t.username} — ${t.subject}</div>
                <div style="font-size:.85rem;color:var(--text-sub);">${t.message}</div>
                <div style="margin-top:6px;display:flex;gap:8px;">
                    <button class="action-btn green" style="padding:4px 12px;font-size:.7rem;" onclick="answerTicket(${idx})">💬 Ответить</button>
                </div>
            </div>
        `).join('');
    }
    document.getElementById('modCountBadgeNew').innerText = subs.length + hwidReqs.length + tickets.length;
}

// Функции для модерации (approve/reject)
function approveSub(idx) {
    appRequests.subs[idx].status = 'approved';
    const sub = appRequests.subs[idx];
    const user = registeredUsers[sub.username.toLowerCase()];
    if (user) {
        user.sub = sub.tariff.includes('Навсегда') ? 'Навсегда' : sub.tariff.includes('3 месяца') ? '3 месяца' : '1 месяц';
        saveDB();
    }
    saveDB();
    renderModerationData();
    showToast('Подписка одобрена!', 'success');
}
function rejectSub(idx) { appRequests.subs.splice(idx, 1); saveDB(); renderModerationData(); showToast('Запрос отклонён.'); }
function approveHWID(idx) {
    appRequests.hwid[idx].status = 'approved';
    const req = appRequests.hwid[idx];
    // Здесь можно очистить HWID пользователя (в реальности сброс)
    showToast('HWID сброшен для ' + req.username, 'success');
    saveDB();
    renderModerationData();
}
function rejectHWID(idx) { appRequests.hwid.splice(idx, 1); saveDB(); renderModerationData(); showToast('Заявка отклонена.'); }
function answerTicket(idx) {
    const answer = prompt('Введите ответ на тикет:');
    if (answer === null) return;
    if (!answer.trim()) { showToast('Ответ не может быть пустым!', 'error'); return; }
    appRequests.tickets[idx].status = 'answered';
    appRequests.tickets[idx].answer = answer.trim();
    saveDB();
    renderModerationData();
    showToast('Ответ отправлен!', 'success');
}

// ===== УПРАВЛЕНИЕ РОЛЯМИ =====
let customRoles = JSON.parse(localStorage.getItem('runclient_custom_roles')) || [];

function renderRolesManagement() {
    const container = document.getElementById('rolesListContainer');
    if (!currentUser) return;
    const user = registeredUsers[currentUser.toLowerCase()];
    if (user?.role !== 'owner' && user?.role !== 'admin') {
        container.innerHTML = '<p class="sub-desc">Доступ запрещён.</p>';
        return;
    }
    const allRoles = ['user', 'moder', 'admin', 'owner', ...customRoles];
    container.innerHTML = allRoles.map(role => `
        <div style="background:rgba(0,0,0,0.3);padding:12px;border-radius:12px;margin-bottom:8px;border:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;">
            <span style="font-weight:700;color:#fff;">${role}</span>
            <div>
                <button class="action-btn" style="padding:2px 12px;font-size:.7rem;background:#666;" onclick="deleteRole('${role}')">Удалить</button>
            </div>
        </div>
    `).join('');
}

function createNewRole() {
    if (!currentUser) return;
    const user = registeredUsers[currentUser.toLowerCase()];
    if (user?.role !== 'owner' && user?.role !== 'admin') { showToast('Доступ запрещён!', 'error'); return; }
    const name = document.getElementById('newRoleNameInput').value.trim();
    if (!name) { showToast('Введите название роли!', 'error'); return; }
    if (customRoles.includes(name) || ['user','moder','admin','owner'].includes(name)) {
        showToast('Роль уже существует!', 'error');
        return;
    }
    customRoles.push(name);
    localStorage.setItem('runclient_custom_roles', JSON.stringify(customRoles));
    renderRolesManagement();
    showToast('Роль "' + name + '" создана!', 'success');
    document.getElementById('newRoleNameInput').value = '';
}

function deleteRole(role) {
    if (!currentUser) return;
    const user = registeredUsers[currentUser.toLowerCase()];
    if (user?.role !== 'owner' && user?.role !== 'admin') { showToast('Доступ запрещён!', 'error'); return; }
    if (['user','moder','admin','owner'].includes(role)) { showToast('Нельзя удалить системную роль!', 'error'); return; }
    const idx = customRoles.indexOf(role);
    if (idx > -1) {
        customRoles.splice(idx, 1);
        localStorage.setItem('runclient_custom_roles', JSON.stringify(customRoles));
        renderRolesManagement();
        showToast('Роль удалена.', 'success');
    }
}

// ===== НАСТРОЙКА ВОЗМОЖНОСТЕЙ ПОЛЬЗОВАТЕЛЯ =====
function searchUserCapabilities() {
    const query = document.getElementById('capSearchInput').value.trim().toLowerCase();
    const container = document.getElementById('capSearchResultContainer');
    if (!query) { container.innerHTML = ''; return; }
    const found = Object.keys(registeredUsers).filter(u => u.includes(query));
    if (found.length === 0) {
        container.innerHTML = '<p class="sub-desc">Пользователи не найдены.</p>';
        return;
    }
    container.innerHTML = found.map(u => {
        const user = registeredUsers[u];
        return `<div style="background:rgba(0,0,0,0.3);padding:12px;border-radius:12px;margin-top:8px;border:1px solid var(--border-color);">
            <div style="font-weight:800;color:#fff;">${u}</div>
            <div style="font-size:.8rem;color:var(--text-sub);">Роль: ${user.role || 'user'} | Подписка: ${user.sub || 'Нет'}</div>
            <div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;">
                <button class="action-btn" style="padding:4px 12px;font-size:.7rem;" onclick="setUserRole('${u}')">Изменить роль</button>
                <button class="action-btn" style="padding:4px 12px;font-size:.7rem;background:#ffbc00;" onclick="toggleBan('${u}')">${user.banned ? 'Разбанить' : 'Забанить'}</button>
            </div>
        </div>`;
    }).join('');
}

function setUserRole(username) {
    const newRole = prompt('Введите новую роль для ' + username + ':');
    if (newRole === null) return;
    const role = newRole.trim();
    if (!role) { showToast('Роль не может быть пустой!', 'error'); return; }
    const user = registeredUsers[username.toLowerCase()];
    if (!user) { showToast('Пользователь не найден!', 'error'); return; }
    user.role = role;
    saveDB();
    searchUserCapabilities();
    showToast('Роль обновлена!', 'success');
}

function toggleBan(username) {
    const user = registeredUsers[username.toLowerCase()];
    if (!user) { showToast('Пользователь не найден!', 'error'); return; }
    user.banned = !user.banned;
    if (user.banned) user.banReason = prompt('Причина бана:') || 'Нарушение правил';
    else delete user.banReason;
    saveDB();
    searchUserCapabilities();
    showToast(user.banned ? 'Пользователь забанен.' : 'Бан снят.', 'success');
}

// ===== ЗОЛОТАЯ ЛИХОРАДКА =====
function startGoldRush() {
    if (!currentUser) return;
    const user = registeredUsers[currentUser.toLowerCase()];
    if (user?.role !== 'owner' && user?.role !== 'admin' && user?.role !== 'moder') { showToast('Доступ запрещён!', 'error'); return; }
    if (lotteryState.goldRush.active) { showToast('Золотая лихорадка уже активна!', 'error'); return; }
    const duration = parseInt(document.getElementById('grDuration').value) || 1;
    const limit = parseInt(document.getElementById('grLimit').value) || 3;
    if (duration < 1 || limit < 1) { showToast('Введите корректные значения!', 'error'); return; }
    lotteryState.goldRush = {
        active: true,
        duration: duration,
        limit: limit,
        used: 0,
        startTime: Date.now(),
        usedUsers: [],
        timerInterval: null
    };
    saveDB();
    updateGoldRushUI();
    showToast('Золотая лихорадка началась!', 'success');
    // Таймер
    const totalMs = duration * 60 * 1000;
    const endTime = Date.now() + totalMs;
    const interval = setInterval(() => {
        const remaining = endTime - Date.now();
        if (remaining <= 0) {
            clearInterval(interval);
            lotteryState.goldRush.active = false;
            lotteryState.goldRush.timerInterval = null;
            saveDB();
            updateGoldRushUI();
            showToast('Золотая лихорадка завершена!', 'success');
        } else {
            document.getElementById('grTimeLeft').innerText = formatTime(remaining);
            document.getElementById('goldRushTimer').innerText = formatTime(remaining);
        }
    }, 1000);
    lotteryState.goldRush.timerInterval = interval;
    updateGoldRushUI();
}

function updateGoldRushUI() {
    const gr = lotteryState.goldRush;
    if (gr.active) {
        document.getElementById('grStatusText').innerText = 'Активна';
        document.getElementById('grUsedCount').innerText = gr.used + '/' + gr.limit;
        document.getElementById('grStartBtn').disabled = true;
        document.getElementById('grStartBtn').innerText = '⏳ Идёт...';
        document.getElementById('goldRushIndicator').classList.remove('hidden');
        document.getElementById('goldRushCount').innerText = gr.used + '/' + gr.limit;
        // Время
        if (gr.startTime) {
            const elapsed = Date.now() - gr.startTime;
            const remaining = gr.duration * 60 * 1000 - elapsed;
            if (remaining > 0) {
                document.getElementById('grTimeLeft').innerText = formatTime(remaining);
                document.getElementById('goldRushTimer').innerText = formatTime(remaining);
            } else {
                document.getElementById('grTimeLeft').innerText = '00:00';
                document.getElementById('goldRushTimer').innerText = '00:00';
            }
        }
    } else {
        document.getElementById('grStatusText').innerText = 'Не активна';
        document.getElementById('grUsedCount').innerText = '0';
        document.getElementById('grStartBtn').disabled = false;
        document.getElementById('grStartBtn').innerText = 'Начать золотую лихорадку';
        document.getElementById('goldRushIndicator').classList.add('hidden');
        document.getElementById('grTimeLeft').innerText = '--';
        document.getElementById('goldRushTimer').innerText = '00:00';
    }
    updateLotteryUI();
}

function formatTime(ms) {
    const totalSec = Math.floor(ms / 1000);
    const min = String(Math.floor(totalSec / 60)).padStart(2, '0');
    const sec = String(totalSec % 60).padStart(2, '0');
    return min + ':' + sec;
}

// ===== ТЕМЫ ОФОРМЛЕНИЯ =====
function toggleThemePanel() {
    document.getElementById('themePanel').classList.toggle('open');
}

function applyTheme(color, el) {

    document.getElementById('currentColorHex').innerText = color;
    localStorage.setItem('runclient_theme', color);
    document.querySelectorAll('.theme-preset').forEach(p => p.classList.remove('active'));

function toggleGlassMode(checked) {
    document.body.classList.toggle('glass-effect', checked);
    localStorage.setItem('runclient_glass', checked ? 'true' : 'false');
}

// Инициализация темы при загрузке
window.addEventListener('DOMContentLoaded', function() {
    const savedTheme = localStorage.getItem('runclient_theme');
    if (savedTheme) {
        document.documentElement.style.setProperty('--theme-bg', savedTheme);
        document.documentElement.style.setProperty('--bg-main', savedTheme);
        document.getElementById('customColorPicker').value = savedTheme;
        document.getElementById('currentColorHex').innerText = savedTheme;
    }
    const glass = localStorage.getItem('runclient_glass') === 'true';

        updateCabinetUI();
        updateLotteryUI();
    }
    initRoulette();
    // Эффект дождя (декоративный)
    createRain();
    // Частицы (простая заглушка)
    initParticles();
});

// ===== ДЕКОРАТИВНЫЕ ЭФФЕКТЫ =====
function createRain() {
    const container = document.getElementById('rainContainer');
    for (let i = 0; i < 60; i++) {
        const drop = document.createElement('div');
        drop.className = 'rain-drop';
        drop.style.left = Math.random() * 100 + '%';
        drop.style.animationDelay = Math.random() * 2 + 's';
        drop.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
        drop.style.height = (20 + Math.random() * 30) + 'px';
        drop.style.opacity = 0.2 + Math.random() * 0.3;
        container.appendChild(drop);
    }
}

function initParticles() {
    const canvas = document.getElementById('apex-particles');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const particles = [];
    for (let i = 0; i < 50; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            r: 1 + Math.random() * 2,
            alpha: 0.3 + Math.random() * 0.4
        });
    }
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
            if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,' + p.alpha + ')';
            ctx.fill();
        });
        requestAnimationFrame(draw);
    }
    draw();
    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
}

// ===== ИНИЦИАЛИЗАЦИЯ =====
window.addEventListener('DOMContentLoaded', function() {
    // Дополнительные инициализации, если нужно
    if (currentUser) {
        updateCabinetUI();
        updateLotteryUI();
    }
});
