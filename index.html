<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerseDLC Portal</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1a1a24;
            --accent: #6c5ce7;
            --accent-hover: #5b4bc4;
            --text-main: #ffffff;
            --text-sub: #a0a0b0;
            --border: #2a2a3a;
            --star-gold: #ffd700;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* Навигация */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(26, 26, 36, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--accent);
        }

        .nav-links button {
            background: none;
            border: none;
            color: var(--text-sub);
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-links button.active, .nav-links button:hover {
            color: var(--text-main);
            border-bottom: 2px solid var(--accent);
        }

        /* Контейнер страниц */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Карточки и блоки */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        /* Анимированные блоки серверов */
        .servers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .server-card {
            background: linear-gradient(145deg, #1e1e2d, #14141e);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .server-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.2);
        }

        .server-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(108, 92, 231, 0.1) 0%, transparent 70%);
            animation: rotate 6s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .server-title {
            font-size: 28px;
            font-weight: bold;
            position: relative;
            z-index: 1;
            margin-bottom: 10px;
        }

        .server-status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            position: relative;
            z-index: 1;
        }

        /* Система отзывов */
        .star-rating {
            display: flex;
            gap: 5px;
            margin: 10px 0;
            cursor: pointer;
            font-size: 24px;
        }

        .star {
            color: #444;
            transition: color 0.2s;
        }

        .star.active {
            color: var(--star-gold);
        }

        textarea, input {
            width: 100%;
            padding: 12px;
            background: #12121a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        button.btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button.btn-primary:hover {
            background: var(--accent-hover);
        }

        button.btn-primary:disabled {
            background: #444;
            cursor: not-allowed;
        }

        .review-item {
            border-bottom: 1px solid var(--border);
            padding: 15px 0;
        }

        .review-item:last-child {
            border-bottom: none;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .review-user {
            font-weight: bold;
            color: var(--accent);
        }

        .review-stars {
            color: var(--star-gold);
        }

        .review-text {
            margin-top: 8px;
            color: var(--text-sub);
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .alert-info {
            background: rgba(108, 92, 231, 0.1);
            border: 1px solid var(--accent);
            color: #fff;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">VerseDLC</div>
        <div class="nav-links">
            <button class="tab-btn active" onclick="switchTab('main')">Главная</button>
            <button class="tab-btn" onclick="switchTab('reviews')">Отзывы</button>
        </div>
    </nav>

    <div class="container">
        <!-- Главная вкладка -->
        <div id="main" class="tab-content active">
            <h2>Поддерживаемые Серверы</h2>
            <div class="servers-grid">
                <div class="server-card">
                    <div class="server-title">FunTime</div>
                    <div class="server-status">● Работает</div>
                </div>
                <div class="server-card">
                    <div class="server-title">SpookyTime</div>
                    <div class="server-status">● Работает</div>
                </div>
            </div>
        </div>

        <!-- Вкладка отзывов -->
        <div id="reviews" class="tab-content">
            <h2>Отзывы пользователей</h2>
            
            <div class="card">
                <h3>Оставить отзыв</h3>
                <div id="review-form-container">
                    <!-- Заполняется динамически через JS -->
                </div>
            </div>

            <div class="card">
                <h3>Все отзывы</h3>
                <div id="reviews-list">
                    <!-- Список отзывов -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Демо-данные текущей сессии пользователя
        // Подтягивает зарегистрированных пользователей
        const currentUser = {
            username: "Player123",
            hasActiveSubscription: true, // Флаг наличия подписки
            hasLeftReview: false          // Флаг: оставлял ли отзыв
        };

        // Фоновый подсчет зарегистрированных пользователей (без отображения графиков)
        const registeredUsers = ["Player123", "User2", "User3", "User4"];
        let activeUsersCount = registeredUsers.length; 

        // Инициализация базы отзывов
        let reviewsData = [
            { username: "Alex_PvP", rating: 5, text: "Отличный софт, всё работает стабильно!" },
            { username: "Dragon_Killer", rating: 4, text: "Всё гуд, фпс не проседает." }
        ];

        let selectedRating = 0;

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');

            if (tabId === 'reviews') {
                renderReviewForm();
                renderReviews();
            }
        }

        function renderReviewForm() {
            const container = document.getElementById('review-form-container');

            if (!currentUser.hasActiveSubscription) {
                container.innerHTML = `<div class="alert alert-info">Оставлять отзывы могут только пользователи с активной подпиской.</div>`;
                return;
            }

            if (currentUser.hasLeftReview) {
                container.innerHTML = `<div class="alert alert-info">Вы уже оставили отзыв. Повторная отправка недоступна.</div>`;
                return;
            }

            container.innerHTML = `
                <div>
                    <label>Ваш ник:</label>
                    <input type="text" value="${currentUser.username}" disabled>
                </div>
                <div>
                    <label>Оценка:</label>
                    <div class="star-rating" id="star-container">
                        <span class="star" onclick="setRating(1)">★</span>
                        <span class="star" onclick="setRating(2)">★</span>
                        <span class="star" onclick="setRating(3)">★</span>
                        <span class="star" onclick="setRating(4)">★</span>
                        <span class="star" onclick="setRating(5)">★</span>
                    </div>
                </div>
                <div>
                    <textarea id="review-text" rows="4" placeholder="Напишите ваш отзыв..."></textarea>
                </div>
                <button class="btn-primary" onclick="submitReview()">Отправить отзыв</button>
            `;
        }

        function setRating(rating) {
            selectedRating = rating;
            const stars = document.querySelectorAll('#star-container .star');
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        function submitReview() {
            const text = document.getElementById('review-text').value.trim();

            if (selectedRating === 0) {
                alert('Пожалуйста, укажите количество звезд.');
                return;
            }

            if (!text) {
                alert('Пожалуйста, напишите текст отзыва.');
                return;
            }

            // Сохранение отзыва
            reviewsData.unshift({
                username: currentUser.username,
                rating: selectedRating,
                text: text
            });

            currentUser.hasLeftReview = true;
            selectedRating = 0;

            renderReviewForm();
            renderReviews();
        }

        function renderReviews() {
            const list = document.getElementById('reviews-list');
            list.innerHTML = '';

            if (reviewsData.length === 0) {
                list.innerHTML = '<p style="color: var(--text-sub);">Пока нет отзывов.</p>';
                return;
            }

            reviewsData.forEach(item => {
                const starsStr = '★'.repeat(item.rating) + '☆'.repeat(5 - item.rating);
                const reviewEl = document.createElement('div');
                reviewEl.className = 'review-item';
                reviewEl.innerHTML = `
                    <div class="review-header">
                        <span class="review-user">${item.username}</span>
                        <span class="review-stars">${starsStr}</span>
                    </div>
                    <div class="review-text">${item.text}</div>
                `;
                list.appendChild(reviewEl);
            });
        }
    </script>
</body>
</html>
