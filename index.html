<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerseDLC - Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(18, 22, 31, 0.75);
            --accent-color: #7050ef;
            --accent-hover: #5d3fe0;
            --text-color: #e2e8f0;
            --text-dim: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --border-color: rgba(255, 255, 255, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(112, 80, 239, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(112, 80, 239, 0.08) 0%, transparent 40%);
        }

        .app-container {
            width: 100%;
            max-width: 650px;
            padding: 20px;
        }

        .main-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(16px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #fff;
            text-transform: uppercase;
        }

        .logo span {
            color: var(--accent-color);
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.25);
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .nav-btn {
            flex: 1;
            padding: 10px 15px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .nav-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.03);
        }

        .nav-btn.active {
            background: var(--accent-color);
            color: #fff;
            box-shadow: 0 4px 15px rgba(112, 80, 239, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .info-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .info-label {
            color: var(--text-dim);
            font-size: 14px;
        }

        .info-value {
            font-weight: 600;
            font-size: 14px;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
        }

        .badge-owner { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-user { background: rgba(112, 80, 239, 0.15); color: #a78bfa; border: 1px solid rgba(112, 80, 239, 0.3); }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .admin-panel-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .hidden { display: none !important; }

        #toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            background: #181c24;
            border: 1px solid var(--border-color);
            color: #fff;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            transition: 0.3s;
            transform: translateY(100px);
            opacity: 0;
            z-index: 1000;
        }

        #toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="main-card">
            <div class="header">
                <div class="logo">Verse<span>DLC</span></div>
                <div id="current-user-tag" style="font-size: 13px; color: var(--text-dim);"></div>
            </div>

            <!-- Вкладки: Обзор, Загрузка, Админ-панель -->
            <div class="nav-tabs">
                <button class="nav-btn active" onclick="switchTab('overview', this)"><i class="fa-solid fa-house"></i> Обзор</button>
                <button class="nav-btn" onclick="switchTab('download', this)"><i class="fa-solid fa-download"></i> Загрузка</button>
                <button class="nav-btn" id="tab-admin-btn" onclick="switchTab('admin', this)"><i class="fa-solid fa-gear"></i> Админ-панель</button>
            </div>

            <!-- Вкладка: Обзор -->
            <div id="tab-overview" class="tab-content active">
                <div class="info-grid">
                    <div class="info-row">
                        <span class="info-label">Пользователь:</span>
                        <span class="info-value" id="profile-user">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Роль:</span>
                        <span class="info-value"><span id="profile-role" class="badge badge-user">USER</span></span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Подписка:</span>
                        <span class="info-value" id="profile-sub">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Привязка HWID:</span>
                        <span class="info-value" id="profile-hwid">-</span>
                    </div>
                </div>
            </div>

            <!-- Вкладка: Загрузка -->
            <div id="tab-download" class="tab-content">
                <div style="text-align: center; padding: 20px 0;">
                    <p style="color: var(--text-dim); margin-bottom: 20px;">Последняя версия клиента VerseDLC готова к скачиванию.</p>
                    <button class="btn" onclick="showToast('Загрузка лаунчера...', 'success')">Скачать клиент (.jar)</button>
                </div>
            </div>

            <!-- Вкладка: Админ-панель -->
            <div id="tab-admin" class="tab-content">
                <div id="admin-access-denied" class="admin-panel-box hidden">
                    <i class="fa-solid fa-lock" style="font-size: 24px; color: var(--danger); margin-bottom: 10px;"></i>
                    <p style="color: var(--danger); font-weight: 600;">Доступ запрещен</p>
                    <p style="font-size: 13px; color: var(--text-dim); margin-top: 5px;">Эта вкладка доступна только для роли OWNER.</p>
                </div>
                <div id="admin-access-allowed">
                    <div class="admin-panel-box">
                        <p style="font-weight: 600; margin-bottom: 5px;">Панель управления владельца</p>
                        <p style="font-size: 13px; color: var(--text-dim);">Здесь будут генерация ключей, управление юзерами и т.д.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        // Текущий пользователь (если регистрируешься под ником invisik, получишь OWNER, остальные — USER)
        let currentUser = JSON.parse(localStorage.getItem('verse_current_user')) || {
            username: 'invisik',
            role: 'OWNER',
            sub: 'Lifetime',
            hwid: 'NOT BOUND'
        };

        function showToast(text, type = 'error') {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.style.borderColor = type === 'success' ? 'var(--success)' : 'var(--danger)';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function switchTab(tabId, element) {
            // Проверка роли для админки
            if (tabId === 'admin') {
                if (currentUser.role !== 'OWNER') {
                    document.getElementById('admin-access-denied').classList.remove('hidden');
                    document.getElementById('admin-access-allowed').classList.add('hidden');
                } else {
                    document.getElementById('admin-access-denied').classList.add('hidden');
                    document.getElementById('admin-access-allowed').classList.remove('hidden');
                }
            }

            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

            document.getElementById('tab-' + tabId).classList.add('active');
            element.classList.add('active');
        }

        // Функция для регистрации/создания нового юзера с правильным распределением ролей
        function registerNewUser(username, subType) {
            const cleanName = username.trim();
            
            // ЖЕСТКАЯ ПРОВЕРКА: OWNER только у invisik, у всех остальных — USER
            const assignedRole = (cleanName.toLowerCase() === 'invisik') ? 'OWNER' : 'USER';

            currentUser = {
                username: cleanName,
                role: assignedRole,
                sub: subType || '30 Дней',
                hwid: 'NOT BOUND'
            };

            localStorage.setItem('verse_current_user', JSON.stringify(currentUser));
            updateUI();
        }

        function updateUI() {
            document.getElementById('profile-user').innerText = currentUser.username;
            document.getElementById('profile-sub').innerText = currentUser.sub;
            document.getElementById('profile-hwid').innerText = currentUser.hwid;
            
            const roleBadge = document.getElementById('profile-role');
            roleBadge.innerText = currentUser.role;

            if (currentUser.role === 'OWNER') {
                roleBadge.className = 'badge badge-owner';
            } else {
                roleBadge.className = 'badge badge-user';
            }
        }

        updateUI();
    </script>
</body>
</html>
