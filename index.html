<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerseDLC Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .card {
            background: #161b26;
            border: 1px solid #232a3b;
            border-radius: 16px;
            padding: 32px;
            width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
        }

        h2 { font-size: 20px; font-weight: 600; margin-bottom: 20px; color: #f3f4f6; }

        input {
            width: 100%;
            padding: 12px 16px;
            background: #0d111a;
            border: 1px solid #232a3b;
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            margin-bottom: 12px;
        }
        input:focus { border-color: #6366f1; }

        button {
            width: 100%;
            padding: 12px;
            background: #6366f1;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover { background: #4f46e5; }

        .hidden { display: none; }

        .result-box {
            margin-top: 20px;
            padding: 16px;
            background: #0d111a;
            border: 1px dashed #374151;
            border-radius: 10px;
        }

        .key-text {
            font-family: monospace;
            font-size: 16px;
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 12px;
            word-break: break-all;
        }

        .copy-btn { background: #10b981; }
        .copy-btn:hover { background: #059669; }
    </style>
</head>
<body>

    <!-- ФОРМА ВХОДА (Защита от левых) -->
    <div id="loginBlock" class="card">
        <h2>Вход в Админку</h2>
        <input type="password" id="adminPassword" placeholder="Введите админ-пароль">
        <button onclick="login()">Войти</button>
    </div>

    <!-- ОСНОВНАЯ ПАНЕЛЬ -->
    <div id="adminPanel" class="card hidden">
        <h2>VerseDLC Admin</h2>
        
        <input type="text" id="targetNick" placeholder="Введите ник (например, Quesst)">
        <button onclick="generateKey()">Сгенерировать ключ</button>
        <button onclick="searchUser()" style="background: #374151; margin-top: 8px;">Найти пользователя</button>

        <div id="resultBox" class="result-box hidden">
            <div id="keyDisplay" class="key-text"></div>
            <button id="copyBtn" class="copy-btn hidden" onclick="copyKey()">Скопировать ключ</button>
        </div>
    </div>

    <script>
        // Установи свой пароль для входа в админку
        const ADMIN_PASS = "admin123"; 

        function login() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === ADMIN_PASS) {
                document.getElementById('loginBlock').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
            } else {
                alert('Неверный пароль админа!');
            }
        }

        async function generateKey() {
            const nick = document.getElementById('targetNick').value.trim();
            if(!nick) return alert('Введи ник!');

            const res = await fetch('/api', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'generate', username: nick })
            });
            const data = await res.json();

            if (data.success) {
                document.getElementById('keyDisplay').innerText = "Ключ: " + data.key;
                document.getElementById('copyBtn').dataset.key = data.key;
                document.getElementById('copyBtn').classList.remove('hidden');
                document.getElementById('resultBox').classList.remove('hidden');
            }
        }

        async function searchUser() {
            const nick = document.getElementById('targetNick').value.trim();
            if(!nick) return alert('Введи ник!');

            const res = await fetch('/api', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'search', username: nick })
            });
            const data = await res.json();

            if (data.success) {
                document.getElementById('keyDisplay').innerText = "Найден: " + data.username;
                document.getElementById('copyBtn').classList.add('hidden');
                document.getElementById('resultBox').classList.remove('hidden');
            } else {
                alert('Пользователь не найден!');
            }
        }

        function copyKey() {
            const key = document.getElementById('copyBtn').dataset.key;
            navigator.clipboard.writeText(key).then(() => {
                alert('Ключ скопирован в буфер!');
            });
        }
    </script>
</body>
</html>
