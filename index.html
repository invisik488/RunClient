<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel & Management</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #09090b; color: #f4f4f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    .container { width: 100%; max-width: 550px; background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2, h3, h4 { color: #fff; margin-bottom: 12px; }
    
    .auth-box, .admin-box { display: flex; flex-direction: column; gap: 12px; }
    
    input, select, button { width: 100%; padding: 10px 14px; border-radius: 6px; border: 1px solid #3f3f46; background: #27272a; color: #fff; font-size: 14px; outline: none; }
    input:focus, select:focus { border-color: #6366f1; }
    
    button { background: #6366f1; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { background: #4f46e5; }
    .btn-green { background: #22c55e; }
    .btn-green:hover { background: #16a34a; }
    .btn-red { background: #ef4444; margin-top: 10px; }
    .btn-red:hover { background: #dc2626; }
    
    .search-group { display: flex; gap: 8px; }
    .search-group input { flex: 1; }
    .search-group button { width: auto; }
    
    .card { background: #27272a; border: 1px solid #3f3f46; padding: 16px; border-radius: 8px; margin-top: 10px; }
    .user-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #3f3f46; font-size: 13px; }
    .user-item:last-child { border-bottom: none; }
    
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge-active { background: #22c55e22; color: #4ade80; border: 1px solid #22c55e; }
    .badge-none { background: #ef444422; color: #f87171; border: 1px solid #ef4444; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- Окно авторизации -->
  <div id="authBlock" class="auth-box">
    <h2>Вход в панель</h2>
    <input type="text" id="loginInput" placeholder="Введите ваш ник...">
    <button onclick="login()">Войти</button>
  </div>

  <!-- Панель управления -->
  <div id="adminBlock" class="admin-box hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3>Панель Админа</h3>
      <span id="currentUserTag" style="font-size: 12px; color: #a1a1aa;"></span>
    </div>

    <!-- Поиск -->
    <div class="search-group">
      <input type="text" id="searchInput" placeholder="Введите ник игрока...">
      <button onclick="searchUser()">Найти</button>
    </div>

    <!-- Карточка управления игроком -->
    <div id="userCard" class="card hidden">
      <h3 id="targetUsername" style="color: #38bdf8;">Ник: -</h3>
      
      <label style="font-size: 12px; color: #a1a1aa;">Роль:</label>
      <select id="roleSelect">
        <option value="USER">USER</option>
        <option value="VIP">VIP</option>
        <option value="PREMIUM">PREMIUM</option>
        <option value="MEDIA">MEDIA</option>
        <option value="ADMIN">ADMIN</option>
        <option value="OWNER">OWNER</option>
      </select>

      <label style="font-size: 12px; color: #a1a1aa; margin-top: 8px; display: block;">Подписка:</label>
      <select id="subSelect">
        <option value="АКТИВНА">АКТИВНА (Выдать)</option>
        <option value="НЕТ ПОДПИСКИ">НЕТ ПОДПИСКИ (Снять)</option>
        <option value="ЗАБЛОКИРОВАН">ЗАБЛОКИРОВАН</option>
      </select>

      <label style="font-size: 12px; color: #a1a1aa; margin-top: 8px; display: block;">Срок действия:</label>
      <input type="text" id="expiryInput" placeholder="Например: 30 дней или Навсегда">

      <button class="btn-green" onclick="saveUserData()" style="margin-top: 12px;">Сохранить изменения</button>
    </div>

    <!-- Список всех игроков -->
    <div style="margin-top: 15px;">
      <h4 style="color: #a1a1aa;">База игроков:</h4>
      <div id="usersList" class="card" style="max-height: 180px; overflow-y: auto; padding: 10px;"></div>
    </div>

    <button class="btn-red" onclick="logout()">Выйти</button>
  </div>

</div>

<script>
  // Локальная БД
  let db = JSON.parse(localStorage.getItem('app_users_db')) || {
    "invisik": { role: "OWNER", sub: "АКТИВНА", expiry: "Навсегда" }
  };

  let currentUser = null;

  // Функция входа
  function login() {
    const username = document.getElementById("loginInput").value.trim().toLowerCase();
    if (!username) return alert("Введите ник!");

    // Если аккаунта нет в базе, создаем стандартный USER
    if (!db[username]) {
      db[username] = { role: "USER", sub: "НЕТ ПОДПИСКИ", expiry: "—" };
      saveDB();
    }

    currentUser = username;
    document.getElementById("authBlock").classList.add("hidden");
    document.getElementById("adminBlock").classList.remove("hidden");
    document.getElementById("currentUserTag").innerText = `${username} [${db[username].role}]`;

    renderUsersList();
  }

  // Выход
  function logout() {
    currentUser = null;
    document.getElementById("adminBlock").classList.add("hidden");
    document.getElementById("authBlock").classList.remove("hidden");
    document.getElementById("userCard").classList.add("hidden");
    document.getElementById("loginInput").value = "";
  }

  // Сохранение в localStorage
  function saveDB() {
    localStorage.setItem('app_users_db', JSON.stringify(db));
  }

  // Отрисовка базы
  function renderUsersList() {
    const listContainer = document.getElementById("usersList");
    listContainer.innerHTML = "";
    
    const keys = Object.keys(db);
    if (keys.length === 0) {
      listContainer.innerHTML = "<span style='color: #666;'>База пуста</span>";
      return;
    }

    keys.forEach(user => {
      const u = db[user];
      const isSub = u.sub === 'АКТИВНА';
      listContainer.innerHTML += `
        <div class="user-item">
          <span><b>${user}</b> <small style="color: #a1a1aa;">[${u.role}]</small></span>
          <span class="badge ${isSub ? 'badge-active' : 'badge-none'}">${u.sub} (${u.expiry})</span>
        </div>
      `;
    });
  }

  // Поиск игрока
  function searchUser() {
    const query = document.getElementById("searchInput").value.trim().toLowerCase();
    if (!query) return alert("Введите ник!");

    document.getElementById("userCard").classList.remove("hidden");
    document.getElementById("targetUsername").innerText = "Игрок: " + query;

    if (db[query]) {
      document.getElementById("roleSelect").value = db[query].role;
      document.getElementById("subSelect").value = db[query].sub;
      document.getElementById("expiryInput").value = db[query].expiry;
    } else {
      document.getElementById("roleSelect").value = "USER";
      document.getElementById("subSelect").value = "НЕТ ПОДПИСКИ";
      document.getElementById("expiryInput").value = "—";
    }
  }

  // Выдача/Снятие/Сохранение
  function saveUserData() {
    const username = document.getElementById("targetUsername").innerText.replace("Игрок: ", "").trim().toLowerCase();
    const role = document.getElementById("roleSelect").value;
    const sub = document.getElementById("subSelect").value;
    const expiry = document.getElementById("expiryInput").value;

    db[username] = { role, sub, expiry };
    saveDB();

    alert(`Данные для ${username} успешно обновлены!`);
    renderUsersList();
  }
</script>

</body>
</html>
