<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerseDLC - Auth</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #050505; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        .auth-container { width: 100%; max-width: 1000px; padding: 40px; display: flex; justify-content: space-between; align-items: center; }
        .form-section { width: 380px; }
        .brand-logo { width: 40px; height: 40px; fill: #fff; margin-bottom: 24px; }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 30px; }

        .input-group { margin-bottom: 16px; }
        .input-label { display: block; font-size: 13px; color: #888; margin-bottom: 8px; }
        .input-field {
            width: 100%; background: #e8f0fe; border: none; border-radius: 20px;
            padding: 14px 20px; color: #000; font-size: 14px; outline: none; font-weight: 500;
        }

        .checkbox-container { display: flex; align-items: center; gap: 10px; margin: 20px 0; font-size: 13px; color: #888; }
        .checkbox-container input { accent-color: #fff; }

        .submit-btn {
            width: 100%; background: #fff; color: #000; border: none; border-radius: 20px;
            padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .submit-btn:hover { background: #ddd; }

        .visual-section { display: flex; align-items: center; justify-content: center; }
        .door-icon { width: 240px; height: 240px; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="form-section">
            <svg class="brand-logo" viewBox="0 0 100 100">
                <path d="M50 10 L15 85 L35 85 L44 65 L66 65 L50 28 L58 45 L78 85 L95 85 Z M48 55 L52 55 L50 50 Z"/>
            </svg>
            <h1>Create Account</h1>
            <p class="subtitle">Join the elite community today.</p>

            <form id="authForm">
                <div class="input-group">
                    <label class="input-label">Username</label>
                    <input type="text" id="username" class="input-field" value="invisik" required>
                </div>
                <div class="input-group">
                    <label class="input-label">Password</label>
                    <input type="password" id="password" class="input-field" value="12345678" required>
                </div>

                <label class="checkbox-container">
                    <input type="checkbox" checked required>
                    I agree to the Terms of Service.
                </label>

                <button type="submit" class="submit-btn">
                    <span>👤</span> Sign In / Sign Up
                </button>
            </form>
        </div>

        <div class="visual-section">
            <svg class="door-icon" viewBox="0 0 200 200">
                <rect x="50" y="30" width="100" height="140" rx="35" fill="none" stroke="#444" stroke-width="6"/>
                <path d="M20 100 L110 100 M90 80 L110 100 L90 120" fill="none" stroke="#666" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
    </div>

    <script>
        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;

            // Если есть бэкенд - делаем fetch запрос
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username })
                });
            } catch(err) {}

            // Сохраняем сессию юзера
            localStorage.setItem('user', JSON.stringify({ username: username }));

            // РЕДИРЕКТ НА 2-Ю СТРАНИЦУ (ЛИЧНЫЙ КАБИНЕТ)
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
