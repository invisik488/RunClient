<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Dashboard & Admin Panel</title>
  <style>
    :root {
      --bg: #0f0f13;
      --card: #181820;
      --accent: #6c5ce7;
      --accent-hover: #5b4bc4;
      --text: #ffffff;
      --text-dim: #a0a0b0;
      --danger: #ff4757;
      --success: #2ed573;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

    .container { background: var(--card); border-radius: 12px; padding: 30px; width: 100%; max-width: 450px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .container.wide { max-width: 800px; }

    h2 { margin-bottom: 20px; text-align: center; color: var(--accent); }
    
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; background: #22222e; border: none; color: var(--text-dim); border-radius: 6px; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: var(--accent); color: var(--text); }

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: var(--text-dim); font-size: 14px; }
    input, select { width: 100%; padding: 12px; background: #0f0f13; border: 1px solid #2e2e3e; border-radius: 6px; color: #fff; outline: none; }
    input:focus { border-color: var(--accent); }

    button.btn { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    button.btn:hover { background: var(--accent-hover); }
    button.btn-danger { background: var(--danger); }

    .link { color: var(--accent); text-align: center; display: block; margin-top: 15px; cursor: pointer; text-decoration: none; font-size: 14px; }
    .message { margin-top: 15px; padding: 10px; border-radius: 6px; text-align: center; font-size: 14px; display: none; }
    .message.error { background: rgba(255, 71, 87, 0.2); color: var(--danger); display: block; }
    .message.success { background: rgba(46, 213, 115, 0.2); color: var(--success); display: block; }

    .hidden { display: none !important; }
    .user-info { background: #0f0f13; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .user-info p { margin-bottom: 8px; font-size: 15px; }
    .user-info span { color: var(--accent); font-weight: bold; }

    .admin-section { border-top: 1px solid #2e2e3e; padding-top: 20px; margin-top: 20px; }
  </style>
</head>
<body>

  <!-- БЛОК АВТОРИЗАЦИИ / РЕГИСТРАЦИИ -->
  <div id="authContainer" class="container">
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchAuthTab('login')">Вход</button>
      <button class="tab-btn" onclick="switchAuthTab('register')">Регистрация</button>
    </div>

    <!-- Форма Входа -->
    <form id="loginForm">
      <div class="form-group">
        <label>Логин</label>
        <input type="text" id="loginUsername" required>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit" class="btn">Войти</button>
      <a class="link" onclick="switchAuthTab('forgot')">Забыли пароль?</a>
    </form>

    <!-- Форма Регистрации -->
    <form id="registerForm" class="hidden">
      <div class="form-group">
        <label>Никнейм</label>
        <input type="text" id="regNickname" required>
      </div>
      <div class="form-group">
        <label>Логин</label>
        <input type="text" id="regLogin" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" required>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="regPassword" required>
      </div>
      <button type="submit" class="btn">Зарегистрироваться</button>
    </form>

    <!-- Восстановление Пароля -->
    <form id="forgotForm" class="hidden">
      <div class="form-group">
        <label>Email аккаунта</label>
        <input type="email" id="forgotEmail" required>
      </div>
      <button type="button" class="btn" onclick="sendOtpCode()">Получить код</button>

      <div id="otpSection" class="hidden" style="margin-top: 15px;">
        <div class="form-group">
          <label>Код из консоли/почты</label>
          <input type="text" id="otpCode">
        </div>
        <div class="form-group">
          <label>Новый пароль</label>
          <input type="password" id="newPassword">
        </div>
        <button type="button" class="btn" onclick="resetPassword()">Сменить пароль</button>
      </div>
      <a class="link" onclick="switchAuthTab('login')">Назад ко входу</a>
    </form>

    <div id="authMsg" class="message"></div>
  </div>

  <!-- ЛИЧНЫЙ КАБИНЕТ И АДМИНКА -->
  <div id="dashboardContainer" class="container wide hidden">
    <h2>Личный Кабинет</h2>
    
    <div class="user-info">
      <p>Никнейм: <span id="dashNick">-</span></p>
      <p>Роль: <span id="dashRole">-</span></p>
      <p>Подписка до: <span id="dashSub">-</span></p>
    </div>

    <a href="/download/launcher" class="btn" style="text-align: center; text-decoration: none; display: block;">Скачать Лаунчер (.exe)</a>
    <button class="btn btn-danger" onclick="logout()">Выйти</button>

    <!-- Админ-панель (Видна только owner/moderator) -->
    <div id="adminPanel" class="admin-section hidden">
      <h2>Админ Панель</h2>

      <div class="form-group">
        <label>Поиск игрока (Никнейм)</label>
        <input type="text" id="searchNick">
        <button class="btn" onclick="searchUser()">Найти</button>
      </div>

      <div id="targetUserInfo" class="user-info hidden">
        <p>ID: <span id="targetId"></span> | Ник: <span id="targetNick"></span></p>
        <p>Текущая роль: <span id="targetRole"></span></p>
        <p>HWID: <span id="targetHwid">Не привязан</span></p>
        
        <div class="form-group" style="margin-top: 10px;">
          <label>Изменить роль</label>
          <select id="newRoleSelect">
            <option value="user">User</option>
            <option value="media">Media</option>
            <option value="moderator">Moderator</option>
            <option value="owner">Owner</option>
          </select>
        </div>

        <div class="form-group">
          <label>Добавить дней подписки</label>
          <input type="number" id="addDays" value="0">
        </div>

        <button class="btn" onclick="updateUser()">Сохранить изменения</button>
        <button class="btn btn-danger" onclick="resetHwid()">Сбросить HWID</button>
      </div>

      <!-- Управление Тех. работами -->
      <div class="admin-section">
        <h3>Управление сервером</h3>
        <button class="btn btn-danger" onclick="toggleMaintenance(true)">Включить Тех. работы</button>
        <button class="btn" onclick="toggleMaintenance(false)">Выключить Тех. работы</button>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;

    function showMsg(text, isError = false) {
      const msg = document.getElementById('authMsg');
      msg.textContent = text;
      msg.className = `message ${isError ? 'error' : 'success'}`;
    }

    function switchAuthTab(tab) {
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('registerForm').classList.add('hidden');
      document.getElementById('forgotForm').classList.add('hidden');
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      if (tab === 'login') {
        document.getElementById('loginForm').classList.remove('hidden');
        event.target.classList.add('active');
      } else if (tab === 'register') {
        document.getElementById('registerForm').classList.remove('hidden');
        event.target.classList.add('active');
      } else if (tab === 'forgot') {
        document.getElementById('forgotForm').classList.remove('hidden');
      }
    }

    // Регистрация
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nickname: document.getElementById('regNickname').value,
          login: document.getElementById('regLogin').value,
          email: document.getElementById('regEmail').value,
          password: document.getElementById('regPassword').value
        })
      });
      const data = await res.json();
      showMsg(data.message, !data.success);
    });

    // Вход
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          login: document.getElementById('loginUsername').value,
          password: document.getElementById('loginPassword').value
        })
      });
      const data = await res.json();
      if (data.success) {
        currentUser = data.user;
        openDashboard();
      } else {
        showMsg(data.message, true);
      }
    });

    function openDashboard() {
      document.getElementById('authContainer').classList.add('hidden');
      document.getElementById('dashboardContainer').classList.remove('hidden');

      document.getElementById('dashNick').textContent = currentUser.nickname;
      document.getElementById('dashRole').textContent = currentUser.role;
      document.getElementById('dashSub').textContent = currentUser.sub_expires_at ? new Date(currentUser.sub_expires_at).toLocaleString() : 'Нет активной подписки';

      if (currentUser.role === 'owner' || currentUser.role === 'moderator') {
        document.getElementById('adminPanel').classList.remove('hidden');
      }
    }

    function logout() {
      location.reload();
    }

    // Поиск игрока для админки
    async function searchUser() {
      const nick = document.getElementById('searchNick').value;
      const res = await fetch(`/api/admin/user/${nick}`);
      const data = await res.json();

      if (res.ok) {
        document.getElementById('targetUserInfo').classList.remove('hidden');
        document.getElementById('targetId').textContent = data.id;
        document.getElementById('targetNick').textContent = data.nickname;
        document.getElementById('targetRole').textContent = data.role;
        document.getElementById('targetHwid').textContent = data.hwid || 'Не привязан';
        document.getElementById('newRoleSelect').value = data.role;
      } else {
        alert(data.message);
      }
    }

    // Изменение прав/подписки
    async function updateUser() {
      const targetId = document.getElementById('targetId').textContent;
      const res = await fetch('/api/admin/update-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          adminUserId: currentUser.id,
          adminRole: currentUser.role,
          targetUserId: targetId,
          newRole: document.getElementById('newRoleSelect').value,
          daysToAdd: document.getElementById('addDays').value
        })
      });
      const data = await res.json();
      alert(data.message);
      if (data.success) searchUser();
    }

    // Сброс HWID
    async function resetHwid() {
      const targetId = document.getElementById('targetId').textContent;
      const res = await fetch('/api/admin/reset-hwid', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          adminRole: currentUser.role,
          targetUserId: targetId
        })
      });
      const data = await res.json();
      alert(data.message);
      if (data.success) searchUser();
    }

    // Технически работы
    async function toggleMaintenance(enable) {
      const res = await fetch('/api/admin/maintenance', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ enable })
      });
      const data = await res.json();
      alert(data.message);
    }
  </script>
</body>
</html>
